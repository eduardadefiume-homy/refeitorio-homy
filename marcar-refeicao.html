<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;font-family:"Barlow",sans-serif;color:#e8f0ff;background:#050f22;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 10% 20%,rgba(192,40,28,0.1) 0%,transparent 55%),
  radial-gradient(ellipse 60% 60% at 90% 80%,rgba(26,58,110,0.18) 0%,transparent 60%);}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(30,80,200,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(30,80,200,0.04) 1px,transparent 1px);
  background-size:56px 56px;}

/* VIEWS */
.view{display:none;position:relative;z-index:1;min-height:100vh;flex-direction:column}
.view.active{display:flex}

/* HEADER */
.header{position:sticky;top:0;z-index:50;background:rgba(5,15,34,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08)}
.header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:0.9rem;padding:0.8rem 1.4rem}
.back-btn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8fa0be;font-size:1.3rem;text-decoration:none;flex-shrink:0;transition:background .15s}
.back-btn:hover{background:rgba(255,255,255,0.1)}
.back-btn-view{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8fa0be;font-size:1.3rem;flex-shrink:0;transition:background .15s}
.back-btn-view:hover{background:rgba(255,255,255,0.1)}
.header-logo{display:block!important;opacity:1!important;visibility:visible!important;width:32px;height:32px;object-fit:contain;flex-shrink:0;border-radius:50%;background:rgba(255,255,255,.04)}
.header-titles{flex:1}
.header-title{font-family:"Barlow Condensed",sans-serif;font-size:1.15rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#fff;line-height:1}
.header-sub{font-size:0.7rem;color:rgba(143,170,210,0.55);letter-spacing:0.14em;text-transform:uppercase;margin-top:2px}
.prazo-badge{font-size:0.82rem;font-weight:700;background:rgba(255,150,0,0.15);border:1px solid rgba(255,150,0,0.3);color:rgba(255,180,80,0.95);padding:8px 14px;border-radius:8px;white-space:nowrap;min-width:max-content}

/* CONTENT */
.content{max-width:900px;margin:0 auto;padding:1.2rem 1.4rem 3rem;flex:1;width:100%}

/* SECTION TITLE */
.section-title{font-family:"Barlow Condensed",sans-serif;font-size:1.4rem;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.8rem;display:flex;align-items:center;gap:0.6rem}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:1rem}
.search-input{width:100%;padding:0.9rem 1rem 0.9rem 3rem;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;font-family:"Barlow",sans-serif;font-size:1rem;outline:none;transition:border-color .18s,background .18s}
.search-input::placeholder{color:rgba(143,170,210,0.45)}
.search-input:focus{border-color:rgba(60,140,255,0.4);background:rgba(255,255,255,0.08)}
.search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:rgba(143,170,210,0.45);font-size:1rem;pointer-events:none}
.search-count{font-size:0.72rem;color:rgba(143,170,210,0.45);margin-bottom:0.7rem;padding-left:2px}

/* FUNC GRID */
.func-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0.65rem}
.func-card{border-radius:14px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);padding:1rem 1.1rem;cursor:pointer;display:flex;align-items:center;gap:0.85rem;transition:all .18s}
.func-card:hover{background:rgba(26,58,110,0.3);border-color:rgba(60,140,255,0.3);transform:translateY(-2px)}
.func-card:active{transform:scale(0.98)}
.func-card.confirmado{opacity:0.4;pointer-events:none;filter:grayscale(0.5)}
.func-avatar{width:42px;height:42px;border-radius:50%;background:rgba(26,58,110,0.6);border:2px solid rgba(60,140,255,0.3);display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-size:0.95rem;font-weight:700;color:rgba(140,200,255,0.95);flex-shrink:0}
.func-info{flex:1;min-width:0}
.func-name{font-size:0.92rem;font-weight:600;color:#fff;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.func-dept{font-size:0.7rem;color:rgba(143,170,210,0.55);margin-top:2px}
.func-status-badge{font-size:0.58rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-top:4px;display:inline-block}
.badge-confirmado{background:rgba(64,208,144,0.15);color:#40d090;border:1px solid rgba(64,208,144,0.25)}
.badge-pendente{background:rgba(255,150,0,0.12);color:rgba(255,180,80,0.85);border:1px solid rgba(255,150,0,0.2)}

/* ===== VIEW 2 — PEDIDO ===== */
/* STEPS */
.steps-header{max-width:900px;margin:0 auto;padding:1rem 1.4rem 0.2rem;display:flex;align-items:center;gap:0.5rem;overflow-x:auto;scrollbar-width:none}
.steps-header::-webkit-scrollbar{display:none}
.step-item{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;cursor:pointer;opacity:0.4;transition:opacity .2s}
.step-item.active{opacity:1}
.step-item.done{opacity:0.7}
.step-dot{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;color:#fff;transition:all .2s}
.step-item.active .step-dot{border-color:#c0281c;background:rgba(192,40,28,0.3);color:#fff}
.step-item.done .step-dot{border-color:#40d090;background:rgba(64,208,144,0.2);color:#40d090}
.step-label{font-size:0.58rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(143,170,210,0.6);white-space:nowrap}
.step-item.active .step-label{color:rgba(255,160,140,0.9)}
.step-connector{width:24px;height:2px;background:rgba(255,255,255,0.1);flex-shrink:0;margin-bottom:12px}
.step-item.done+.step-connector{background:rgba(64,208,144,0.3)}

/* DAY CONTENT */
.day-content{max-width:900px;margin:0 auto;padding:1rem 1.4rem;flex:1}
.day-title{font-family:"Barlow Condensed",sans-serif;font-size:1.5rem;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.3rem}
.day-subtitle{font-size:0.8rem;color:rgba(143,170,210,0.55);margin-bottom:1rem}

/* OPCOES GRID */
.opcoes-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.75rem;margin-bottom:1.2rem}

.opcao-card{border-radius:16px;border:2px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);padding:1rem;cursor:pointer;transition:all .18s;position:relative;display:flex;flex-direction:column;gap:0.5rem}
.opcao-card:hover{background:rgba(255,255,255,0.07);transform:translateY(-2px)}
.opcao-card.selected{border-color:rgba(192,40,28,0.7)!important;background:rgba(192,40,28,0.12)!important;box-shadow:0 0 20px rgba(192,40,28,0.2)}
.opcao-card .check{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:transparent;transition:all .18s;flex-shrink:0}
.opcao-card.selected .check{border-color:#40d090;background:rgba(64,208,144,0.2);color:#40d090}

.opcao-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem}
.opcao-tag{font-size:0.6rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border-radius:5px;flex-shrink:0}
.tag-principal{background:rgba(26,58,110,0.7);color:rgba(140,200,255,0.95);border:1px solid rgba(60,140,255,0.3)}
.tag-light{background:rgba(16,110,90,0.6);color:rgba(80,220,160,0.95);border:1px solid rgba(16,160,120,0.35)}
.tag-carne{background:rgba(192,40,28,0.45);color:rgba(255,160,140,0.95);border:1px solid rgba(192,40,28,0.38)}
.tag-massa{background:rgba(100,60,10,0.6);color:rgba(255,200,100,0.95);border:1px solid rgba(180,120,20,0.35)}
.tag-lanche{background:rgba(80,20,140,0.65);color:rgba(200,160,255,0.95);border:1px solid rgba(140,80,220,0.4)}

.opcao-nome{font-size:1rem;font-weight:600;color:#fff;line-height:1.3;margin-bottom:0.5rem}
.opcao-aviso{font-size:0.75rem;color:rgba(255,200,100,0.75);line-height:1.45;padding:0.5rem 0.6rem;border-radius:8px;background:rgba(255,180,0,0.07);border:1px solid rgba(255,180,0,0.12);margin-top:0.2rem}
.opcao-detalhes{display:flex;flex-direction:column;gap:0.2rem;margin-top:0.3rem}
.opcao-detalhe{font-size:0.78rem;color:rgba(143,170,210,0.7);display:flex;align-items:flex-start;gap:0.35rem;line-height:1.45}
.opcao-detalhe::before{content:"·";color:rgba(192,40,28,0.7);font-size:1rem;line-height:1.2;flex-shrink:0}

/* NAV BOTTOM */
.nav-bottom{max-width:900px;margin:0 auto;padding:1rem 1.4rem 2rem;display:flex;gap:0.7rem;align-items:center}
.btn-nav{flex:1;padding:0.9rem 1rem;border-radius:12px;font-family:"Barlow",sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;border:none;transition:all .18s;text-align:center}
.btn-prev{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#8fa0be}
.btn-prev:hover{background:rgba(255,255,255,0.1)}
.btn-next{background:rgba(192,40,28,0.8);color:#fff;box-shadow:0 4px 16px rgba(192,40,28,0.3)}
.btn-next:hover{background:rgba(192,40,28,1);transform:translateY(-1px)}
.btn-next:disabled{background:rgba(255,255,255,0.06);color:rgba(143,170,210,0.4);cursor:not-allowed;transform:none;box-shadow:none}
.btn-confirm{background:rgba(64,208,144,0.8);color:#fff;box-shadow:0 4px 16px rgba(64,208,144,0.25)}
.btn-confirm:hover{background:rgba(64,208,144,1);transform:translateY(-1px)}

/* RESUMO */
.resumo-wrap{display:flex;flex-direction:column;gap:0.6rem;margin-bottom:1rem}
.resumo-dia{border-radius:13px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);padding:0.85rem 1rem;display:flex;align-items:center;gap:0.8rem}
.resumo-dia-label{font-family:"Barlow Condensed",sans-serif;font-size:1rem;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:0.04em;min-width:80px}
.resumo-dia-opcao{display:flex;align-items:center;gap:0.5rem;flex:1}
.resumo-dia-nome{font-size:0.88rem;color:rgba(200,220,255,0.85)}
.resumo-aviso{border-radius:11px;border:1px solid rgba(255,150,0,0.2);background:rgba(255,150,0,0.06);padding:0.75rem 1rem;font-size:0.8rem;color:rgba(255,180,80,0.85);line-height:1.5}

/* MODAL CONFIRMAÇÃO */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(3,8,20,0.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:1.5rem;opacity:0;pointer-events:none;transition:opacity 0.22s ease}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:#0b1a35;border:1px solid rgba(255,255,255,0.12);border-radius:22px;width:100%;max-width:400px;box-shadow:0 24px 80px rgba(0,0,0,0.7);overflow:hidden;transform:scale(0.92) translateY(16px);transition:transform 0.25s cubic-bezier(.22,1,.36,1);text-align:center;padding:2rem 1.5rem}
.modal-overlay.open .modal{transform:scale(1) translateY(0)}
.modal-icon{font-size:2.5rem;margin-bottom:0.8rem}
.modal-title{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;font-weight:700;color:#fff;margin-bottom:0.5rem}
.modal-text{font-size:0.88rem;color:rgba(143,170,210,0.75);line-height:1.6;margin-bottom:1.5rem}
.modal-btn{width:100%;padding:0.9rem;border-radius:12px;font-family:"Barlow",sans-serif;font-size:1rem;font-weight:600;cursor:pointer;border:none;background:rgba(64,208,144,0.8);color:#fff;transition:all .18s}
.modal-btn:hover{background:rgba(64,208,144,1)}

/* RESPONSIVO */
@media(max-width:480px){
  .opcoes-grid{grid-template-columns:1fr}
  .func-grid{grid-template-columns:1fr}
}
@media(min-width:768px) and (orientation:landscape){
  .opcoes-grid{grid-template-columns:repeat(4,1fr)}
  .func-grid{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1024px){
  .opcoes-grid{grid-template-columns:repeat(4,1fr)}
  .func-grid{grid-template-columns:repeat(4,1fr)}
}


/* ===== FUNDO HOMY TECH + QUÍMICA (PADRÃO REFEITÓRIO) ===== */
body{background:#040c1a!important;}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 42% at 18% 8%,rgba(35,98,210,.20),transparent 60%),
    radial-gradient(ellipse 62% 40% at 88% 88%,rgba(24,190,125,.12),transparent 64%),
    radial-gradient(ellipse 50% 34% at 50% 105%,rgba(192,40,28,.10),transparent 70%),
    linear-gradient(180deg,#040c1a 0%,#041126 58%,#030912 100%)!important;
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(72,138,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(72,138,255,.045) 1px,transparent 1px)!important;
  background-size:56px 56px!important;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,.25));
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,.25));
}
.homy-tech-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#homyTechCanvas{position:absolute;inset:0;width:100%;height:100%;opacity:.82}
.homy-scan-line{
  position:absolute;left:-20%;right:-20%;top:-12%;height:160px;
  background:linear-gradient(180deg,transparent,rgba(80,170,255,.055),rgba(34,200,121,.03),transparent);
  transform:rotate(-7deg);
  animation:homyScanMove 11s ease-in-out infinite;
}
@keyframes homyScanMove{
  0%{top:-20%;opacity:0}
  16%{opacity:1}
  70%{opacity:.75}
  100%{top:108%;opacity:0}
}
.homy-chem-symbol{
  position:absolute;width:150px;height:132px;opacity:.12;
  filter:drop-shadow(0 0 22px rgba(80,170,255,.25));
  animation:homyChemFloat 12s ease-in-out infinite alternate;
}
.homy-chem-symbol.s1{left:8%;top:14%;animation-duration:15s}
.homy-chem-symbol.s2{right:8%;top:16%;animation-duration:18s;transform:scale(.8) rotate(18deg)}
.homy-chem-symbol.s3{left:52%;bottom:7%;animation-duration:20s;transform:scale(1.15) rotate(-10deg)}
.homy-chem-symbol::before{
  content:"";position:absolute;inset:18px;border:1px solid rgba(122,190,255,.52);
  clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%);
}
.homy-chem-symbol::after{
  content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;
  background:rgba(34,200,121,.75);
  box-shadow:
    -48px -42px 0 rgba(97,184,255,.75),
    48px -42px 0 rgba(97,184,255,.7),
    65px 0 0 rgba(192,40,28,.68),
    48px 42px 0 rgba(97,184,255,.72),
    -48px 42px 0 rgba(97,184,255,.72),
    -65px 0 0 rgba(34,200,121,.65);
}
@keyframes homyChemFloat{
  0%{translate:0 0;opacity:.08}
  50%{translate:14px -18px;opacity:.16}
  100%{translate:-10px 12px;opacity:.11}
}
/* garante que o conteúdo fique acima do fundo */
.header,.main-content,.cards-area,.week-nav,.day-tabs-wrap,.view,.content,.app,#app,#splash,.modal-overlay,.modal-bg{position:relative;z-index:1}

</style>

<script>
window.HOMY_SP_READY = (function(){
  function loadScript(src){
    return new Promise(function(resolve,reject){
      var s=document.createElement("script");
      s.src=src;
      s.onload=resolve;
      s.onerror=function(){reject(new Error("Falha ao carregar: "+src));};
      document.head.appendChild(s);
    });
  }

  return loadScript("https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js")
    .catch(function(){

<script>
// --- MARCAR REFEIÇÃO V18: DADOS REAIS DO SHAREPOINT ---
const DIAS_SEMANA = [
  {key:"seg", label:"Segunda-feira", dia:"segunda"},
  {key:"ter", label:"Terça-feira", dia:"terca"},
  {key:"qua", label:"Quarta-feira", dia:"quarta"},
  {key:"qui", label:"Quinta-feira", dia:"quinta"},
  {key:"sex", label:"Sexta-feira", dia:"sexta"}
];

const TAG_CLASS = {
  principal:"tag-principal",
  light:"tag-light",
  fitness:"tag-light",
  vegetariano:"tag-light",
  carne:"tag-carne",
  massa:"tag-massa",
  lanche:"tag-lanche"
};

let FUNCIONARIOS = [];
let CARDAPIO = {};
let PEDIDOS_EXISTENTES = [];
let SEMANA_ID = null;

let funcSelecionado = null;
let stepAtual = 0;
let pedidos = {};

function getInitials(nome){
  const p = String(nome || "").trim().split(/\s+/).filter(Boolean);
  if(!p.length) return "?";
  return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
}

function normalizarDia(valor){
  const v = String(valor || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(v.startsWith("seg")) return "seg";
  if(v.startsWith("ter")) return "ter";
  if(v.startsWith("qua")) return "qua";
  if(v.startsWith("qui")) return "qui";
  if(v.startsWith("sex")) return "sex";
  return v;
}

function getSemanaAtual(){
  if(typeof SP !== "undefined" && SP.getSemanaId) return SP.getSemanaId(new Date());

  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const week1 = new Date(d.getFullYear(),0,4);
  const weekNum = 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return `${d.getFullYear()}-W${String(weekNum).padStart(2,"0")}`;
}

function getWeekDatesLocal(semanaId){
  if(typeof SP !== "undefined" && SP.getWeekDates) return SP.getWeekDates(semanaId);

  const [year, week] = semanaId.split("-W").map(Number);
  const jan4 = new Date(year,0,4);
  const start = new Date(jan4);
  start.setDate(jan4.getDate() - (jan4.getDay() || 7) + 1 + (week - 1) * 7);
  return Array.from({length:5}, (_,i)=>{
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    return d;
  });
}

function formatDataCurta(date){
  return date.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
}

function mapColaborador(item){
  return {
    id: item.id || item.ID || item.Id || item.Nome || item.Title,
    nome: item.Nome || item.Title || item.nome || "Sem nome",
    dept: item.Departamento || item.departamento || "",
    email: item.Email || item.email || "",
    tipo: item.tipo || "colaborador",
    confirmado: false
  };
}

function mapCardapio(items){
  const map = {seg:[], ter:[], qua:[], qui:[], sex:[]};

  items.forEach(item=>{
    const key = normalizarDia(item.Dia || item.dia);
    if(!map[key]) return;

    const tag = String(item.Opcao || item.opcao || "principal").toLowerCase();
    map[key].push({
      tag,
      tagClass: TAG_CLASS[tag] || "tag-principal",
      nome: item.Nome_Prato || item.nome_prato || item.Title || "Prato não informado",
      detalhes: item.Detalhes ? String(item.Detalhes).split(/\n|;/).map(x=>x.trim()).filter(Boolean) : [],
      aviso: null
    });
  });

  Object.keys(map).forEach(k=>{
    if(!map[k].length){
      map[k].push({
        tag:"principal",
        tagClass:"tag-principal",
        nome:"Cardápio não cadastrado",
        detalhes:["Procure a Luana/TI para cadastrar o cardápio desta semana."],
        aviso:null
      });
    }
  });

  return map;
}

async function carregarDadosSharePoint(){
  try{
    await window.HOMY_SP_READY;
    await SP.ensureLogin();

    SEMANA_ID = getSemanaAtual();
    const datas = getWeekDatesLocal(SEMANA_ID);

    DIAS_SEMANA.forEach((d,i)=>{
      d.data = formatDataCurta(datas[i]);
    });

    const [colabs, cardapio, pedidosSemana] = await Promise.all([
      SP.getColaboradores(),
      SP.getCardapio(SEMANA_ID),
      SP.getPedidos(SEMANA_ID)
    ]);

    PEDIDOS_EXISTENTES = pedidosSemana || [];
    CARDAPIO = mapCardapio(cardapio || []);

    FUNCIONARIOS = (colabs || []).map(mapColaborador).map(f=>{
      f.confirmado = PEDIDOS_EXISTENTES.some(p =>
        String(p.Colaborador_id || p.colaborador_id || p.ColaboradorId || "") === String(f.id) ||
        String(p.Colaborador_nome || p.colaborador_nome || p.Title || "").toLowerCase() === String(f.nome).toLowerCase()
      );
      return f;
    }).sort((a,b)=>a.nome.localeCompare(b.nome));

    renderFuncs(FUNCIONARIOS);

  }catch(e){
    console.error("Erro ao carregar dados do SharePoint:", e);
    const count = document.getElementById("searchCount");
    if(count) count.textContent = "Não foi possível carregar. Entre com uma conta Homy autorizada e tente novamente.";
    renderFuncs([]);
  }
}

// --- VIEW 1: LISTA FUNCIONÁRIOS ---
function renderFuncs(lista){
  const grid = document.getElementById("funcGrid");
  if(!grid) return;

  grid.innerHTML = "";
  document.getElementById("searchCount").textContent = lista.length+" colaborador"+(lista.length!==1?"es":"")+" encontrado"+(lista.length!==1?"s":"");

  lista.forEach(func=>{
    const card = document.createElement("div");
    card.className = "func-card" + (func.confirmado ? " confirmado" : "");
    card.innerHTML =
      '<div class="func-avatar">'+getInitials(func.nome)+'</div>'+
      '<div class="func-info">'+
      '<div class="func-name">'+func.nome+'</div>'+
      '<div class="func-dept">'+(func.dept || "")+'</div>'+
      '<span class="func-status-badge '+(func.confirmado?"badge-confirmado":"badge-pendente")+'">'+(func.confirmado?"Confirmado":"Pendente")+'</span>'+
      '</div>';

    if(!func.confirmado){
      card.addEventListener("click",()=>selecionarFunc(func));
    }

    grid.appendChild(card);
  });
}

document.getElementById("searchInput").addEventListener("input",function(){
  const q = this.value.toLowerCase().trim();
  renderFuncs(q ? FUNCIONARIOS.filter(f => f.nome.toLowerCase().includes(q) || String(f.dept||"").toLowerCase().includes(q)) : FUNCIONARIOS);
});

function selecionarFunc(func){
  funcSelecionado = func;
  pedidos = {};
  stepAtual = 0;

  document.getElementById("v2Title").textContent = func.nome.split(" ")[0];
  document.getElementById("v2Sub").textContent = "Escolha sua refeição por dia";
  document.getElementById("v3Sub").textContent = func.nome;

  showView("view2");
  renderStep();
}

// --- VIEW 2: STEPS ---
function buildStepsHeader(){
  const el = document.getElementById("stepsHeader");
  el.innerHTML = "";

  DIAS_SEMANA.forEach((dia,i)=>{
    if(i>0){
      const conn=document.createElement("div");
      conn.className="step-connector";
      el.appendChild(conn);
    }

    const item=document.createElement("div");
    const done=pedidos[dia.key]!=null;
    const active=i===stepAtual;

    item.className="step-item"+(active?" active":"")+(done&&!active?" done":"");
    item.innerHTML='<div class="step-dot">'+(done&&!active?"✓":(i+1))+'</div><div class="step-label">'+dia.key.charAt(0).toUpperCase()+dia.key.slice(1)+'</div>';
    item.addEventListener("click",()=>{ if(done||active){ stepAtual=i; renderStep(); }});
    el.appendChild(item);
  });
}

function renderStep(){
  buildStepsHeader();

  const dia = DIAS_SEMANA[stepAtual];
  const opcoes = CARDAPIO[dia.key] || [];
  const selecionada = pedidos[dia.key];
  const isLast = stepAtual === DIAS_SEMANA.length - 1;

  const btnNext = document.getElementById("btnNext");
  const btnPrev = document.getElementById("btnPrev");

  btnPrev.style.display = stepAtual === 0 ? "none" : "block";
  btnNext.textContent = isLast ? "Ver resumo →" : "Próximo →";
  btnNext.disabled = !selecionada;
  btnNext.className = "btn-nav btn-next" + (isLast ? " btn-confirm" : "");

  const content = document.getElementById("dayContent");
  content.innerHTML =
    '<div class="day-title">'+dia.label+'</div>'+
    '<div class="day-subtitle">'+(dia.data || "")+'/2026 — Escolha uma opção</div>'+
    '<div class="opcoes-grid" id="opcoesGrid"></div>';

  const grid = document.getElementById("opcoesGrid");

  opcoes.forEach(op=>{
    const card = document.createElement("div");
    const sel = selecionada && selecionada.tag === op.tag && selecionada.nome === op.nome;

    card.className = "opcao-card" + (sel ? " selected" : "");
    card.innerHTML =
      '<div class="opcao-top">'+
        '<span class="opcao-tag '+op.tagClass+'">'+op.tag+'</span>'+
        '<div class="check">✓</div>'+
      '</div>'+
      '<div class="opcao-nome">'+op.nome+'</div>'+
      (op.detalhes&&op.detalhes.length ?
        '<div class="opcao-detalhes">'+op.detalhes.map(d=>'<div class="opcao-detalhe">'+d+'</div>').join('')+'</div>'
        : '')+
      (op.aviso ? '<div class="opcao-aviso">ℹ️ '+op.aviso+'</div>' : "");

    card.addEventListener("click",()=>{
      pedidos[dia.key] = {
        tag: op.tag,
        tagClass: op.tagClass,
        nome: op.nome,
        dia: dia.dia
      };
      renderStep();
    });

    grid.appendChild(card);
  });
}

document.getElementById("btnNext").addEventListener("click",()=>{
  if(stepAtual < DIAS_SEMANA.length - 1){
    stepAtual++;
    renderStep();
  }else{
    showView("view3");
    renderResumo();
  }
});

document.getElementById("btnPrev").addEventListener("click",()=>{
  if(stepAtual > 0){
    stepAtual--;
    renderStep();
  }
});

document.getElementById("btnVoltarView1").addEventListener("click",()=>showView("view1"));
document.getElementById("btnVoltarView2").addEventListener("click",()=>{showView("view2"); renderStep();});

// --- VIEW 3: RESUMO ---
function renderResumo(){
  const wrap = document.getElementById("resumoWrap");
  wrap.innerHTML = "";

  DIAS_SEMANA.forEach(dia=>{
    const p = pedidos[dia.key];
    const row = document.createElement("div");
    row.className = "resumo-dia";
    row.innerHTML =
      '<div class="resumo-dia-label">'+dia.label.split("-")[0].trim()+'</div>'+
      '<div class="resumo-dia-opcao">'+
      (p ? '<span class="opcao-tag '+p.tagClass+'" style="font-size:0.55rem;padding:2px 7px">'+p.tag+'</span><span class="resumo-dia-nome">'+p.nome+'</span>' : '<span style="color:rgba(143,170,210,0.4);font-size:0.85rem">Não marcado</span>')+
      '</div>';
    wrap.appendChild(row);
  });
}

document.getElementById("btnConfirmar").addEventListener("click", async ()=>{
  if(!funcSelecionado){
    alert("Selecione um colaborador.");
    return;
  }

  const selecionados = Object.keys(pedidos);
  if(!selecionados.length){
    alert("Selecione pelo menos uma refeição.");
    return;
  }

  const btn = document.getElementById("btnConfirmar");
  btn.disabled = true;
  btn.textContent = "Salvando pedido...";

  try{
    if(typeof SP === "undefined"){
      throw new Error("sharepoint.js não carregado.");
    }

    await SP.init();

    for(const key of selecionados){
      const diaInfo = DIAS_SEMANA.find(d => d.key === key);
      const pedido = pedidos[key];

      await SP.savePedido(
        SEMANA_ID,
        funcSelecionado.id,
        funcSelecionado.nome,
        diaInfo.dia,
        pedido.tag,
        pedido.nome
      );
    }

    const nomeFirst = funcSelecionado.nome.split(" ")[0];
    document.getElementById("modalText").textContent =
      nomeFirst + ", seu pedido da semana foi confirmado com sucesso! Qualquer alteração deverá ser solicitada à Luana.";

    document.getElementById("modalOverlay").classList.add("open");

    const idx = FUNCIONARIOS.findIndex(f => String(f.id) === String(funcSelecionado.id));
    if(idx >= 0) FUNCIONARIOS[idx].confirmado = true;

  }catch(e){
    console.error("Erro ao salvar pedido:", e);
    alert("Erro ao salvar pedido no SharePoint: " + (e.message || e));
  }finally{
    btn.disabled = false;
    btn.textContent = "✓ Confirmar pedido da semana";
  }
});

document.getElementById("modalBtn").addEventListener("click",()=>{
  document.getElementById("modalOverlay").classList.remove("open");
  document.getElementById("searchInput").value = "";
  renderFuncs(FUNCIONARIOS);
  showView("view1");
});

// --- UTILS ---
function showView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

window.addEventListener("load", carregarDadosSharePoint);
</script>

<script>
// --- PRAZO DINÂMICO ADMIN → MARCAR REFEIÇÃO ---
function formatarPrazoRefeitorio(valor){
  if(!valor) return "Prazo não configurado";
  if(!valor) return "Prazo não definido";

  const data = new Date(valor);
  if(isNaN(data.getTime())) return "Prazo não definido";

  const dias = [
    "domingo",
    "segunda-feira",
    "terça-feira",
    "quarta-feira",
    "quinta-feira",
    "sexta-feira",
    "sábado"
  ];

  const diaSemana = dias[data.getDay()];
  const hora = String(data.getHours()).padStart(2,"0") + "h";

  return `Até ${diaSemana} às ${hora}`;
}

async function carregarPrazoMarcacao(){
  const badge = document.getElementById("prazoBadge");
  if(!badge) return;

  try{
    if(typeof SP === "undefined"){
      badge.textContent = "Prazo indisponível";
      console.error("SP não carregou. Verifique se sharepoint.js está na raiz.");
      return;
    }

    await SP.ensureLogin();

    const prazo = await SP.getPrazoMarcacao();
    badge.textContent = formatarPrazoRefeitorio(prazo);

  }catch(e){
    console.error("Erro ao carregar prazo de marcação:", e);
    badge.textContent = "Entrar para ver prazo";

    try{
      await SP.login();
      const prazo = await SP.getPrazoMarcacao();
      badge.textContent = formatarPrazoRefeitorio(prazo);
    }catch(loginError){
      console.error("Erro ao autenticar para carregar prazo:", loginError);
      badge.textContent = "Prazo indisponível";
    }
  }
}

window.addEventListener("load", carregarPrazoMarcacao);

<script>
(function iniciarFundoHomyTecnologico(){
  const canvas = document.getElementById("homyTechCanvas");
  if (!canvas || canvas.dataset.started === "true") return;
  canvas.dataset.started = "true";

  const ctx = canvas.getContext("2d");
  let w = 0, h = 0, dpr = 1;
  let particles = [];

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);

    const qtd = Math.max(46, Math.min(82, Math.floor(w / 22)));
    particles = Array.from({length:qtd}, (_,i)=>criarParticula(i));
  }

  function criarParticula(i){
    const tipo = i % 11 === 0 ? "red" : i % 5 === 0 ? "green" : "blue";
    return {
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - .5) * .34,
      vy: (Math.random() - .5) * .28,
      r: tipo === "red" ? 2.4 : tipo === "green" ? 2.7 : 2.1 + Math.random() * 1.4,
      tipo,
      fase: Math.random() * Math.PI * 2
    };
  }

  function cor(p, alpha){
    if (p.tipo === "red") return `rgba(192,40,28,${alpha})`;
    if (p.tipo === "green") return `rgba(34,200,121,${alpha})`;
    return `rgba(97,184,255,${alpha})`;
  }

  function desenharHexagonos(t){
    const estruturas = [
      {x:w*.18,y:h*.18,s:58,a:.16},
      {x:w*.82,y:h*.24,s:74,a:.12},
      {x:w*.62,y:h*.78,s:86,a:.10}
    ];

    estruturas.forEach((m,idx)=>{
      ctx.save();
      ctx.translate(m.x + Math.sin(t/1700+idx)*18, m.y + Math.cos(t/2100+idx)*14);
      ctx.rotate(Math.sin(t/3600+idx)*.18);
      ctx.strokeStyle = `rgba(97,184,255,${m.a})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const ang = Math.PI/3*i + Math.PI/6;
        const x = Math.cos(ang)*m.s;
        const y = Math.sin(ang)*m.s;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.stroke();
      for(let i=0;i<6;i++){
        const ang = Math.PI/3*i + Math.PI/6;
        const x = Math.cos(ang)*m.s;
        const y = Math.sin(ang)*m.s;
        ctx.beginPath();
        ctx.arc(x,y,3.2,0,Math.PI*2);
        ctx.fillStyle = i%3===0 ? "rgba(34,200,121,.22)" : "rgba(97,184,255,.24)";
        ctx.fill();
      }
      ctx.restore();
    });
  }

  function loop(t){
    ctx.clearRect(0,0,w,h);
    desenharHexagonos(t);

    for(const p of particles){
      p.x += p.vx + Math.sin(t/1800 + p.fase) * .055;
      p.y += p.vy + Math.cos(t/2200 + p.fase) * .045;
      if(p.x < -20) p.x = w + 20;
      if(p.x > w + 20) p.x = -20;
      if(p.y < -20) p.y = h + 20;
      if(p.y > h + 20) p.y = -20;
    }

    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const a = particles[i], b = particles[j];
        const dx = a.x-b.x, dy = a.y-b.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        const max = 145;
        if(dist < max){
          const alpha = (1 - dist/max) * .22;
          ctx.beginPath();
          ctx.moveTo(a.x,a.y);
          ctx.lineTo(b.x,b.y);
          ctx.strokeStyle = `rgba(97,184,255,${alpha})`;
          ctx.lineWidth = .8;
          ctx.stroke();
        }
      }
    }

    for(const p of particles){
      const pulse = .65 + Math.sin(t/650 + p.fase) * .35;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r + pulse*.8,0,Math.PI*2);
      ctx.fillStyle = cor(p,.62);
      ctx.shadowColor = p.tipo === "green" ? "rgba(34,200,121,.75)" : p.tipo === "red" ? "rgba(192,40,28,.72)" : "rgba(97,184,255,.75)";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
