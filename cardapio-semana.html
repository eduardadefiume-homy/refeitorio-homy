<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cardápio da Semana · Homy</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;font-family:"Barlow",sans-serif;color:#e8f0ff;overflow-x:hidden}

body{
  background-color:#030d1e;
  background-image:url("../How%20It%20Works.jpg");
  background-size:cover;
  background-position:center center;
  background-attachment:fixed;
  background-repeat:no-repeat;
  -webkit-font-smoothing:antialiased;
}

/* overlay MÍNIMO — só adiciona toque vermelho Homy, preserva 100% da imagem */
body::before{
  content:"";
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 40% 35% at 0% 0%, rgba(192,40,28,0.25) 0%, transparent 50%),
    radial-gradient(ellipse 30% 40% at 100% 100%, rgba(10,25,80,0.3) 0%, transparent 50%),
    rgba(3,13,30,0.15);
}

.header,.week-nav,.day-tabs-wrap,.cards-area{position:relative;z-index:1}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;
  background:rgba(3,10,24,0.9);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(80,140,255,0.15);
}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:0.9rem;padding:0.7rem 1.4rem}
.back-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(80,140,255,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8fa0be;font-size:1.2rem;text-decoration:none;flex-shrink:0;transition:background .15s}
.back-btn:hover{background:rgba(80,140,255,0.15)}
.header-logo{width:30px;height:30px;object-fit:contain;flex-shrink:0}
.header-titles{flex:1}
.header-title{font-family:"Barlow Condensed",sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#fff;line-height:1}
.header-sub{font-size:0.63rem;color:rgba(143,170,210,0.55);letter-spacing:0.14em;text-transform:uppercase;margin-top:1px}
.week-badge{font-size:0.6rem;font-weight:600;letter-spacing:0.06em;background:rgba(20,50,120,0.7);border:1px solid rgba(80,140,255,0.3);color:rgba(140,200,255,0.9);padding:4px 9px;border-radius:6px;white-space:nowrap}

/* WEEK NAV */
.week-nav{max-width:1100px;margin:0 auto;padding:0.9rem 1.4rem 0.5rem;display:flex;align-items:center;justify-content:space-between}
.week-nav-btn{width:32px;height:32px;border-radius:8px;background:rgba(3,10,24,0.7);border:1px solid rgba(80,140,255,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8fa0be;font-size:0.95rem;transition:background .15s;user-select:none;backdrop-filter:blur(8px)}
.week-nav-btn:hover{background:rgba(20,50,120,0.5)}
.week-label{font-size:0.78rem;font-weight:500;color:rgba(200,220,255,0.92);letter-spacing:0.05em;text-shadow:0 1px 10px rgba(0,0,0,0.9)}

/* DAY TABS */
.day-tabs-wrap{padding:0 1.4rem;max-width:1100px;margin:0 auto}
.day-tabs{display:flex;gap:0.45rem;overflow-x:auto;padding-bottom:0.5rem;scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{
  flex:1;min-width:80px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:0.55rem 0.6rem;border-radius:11px;cursor:pointer;
  border:1px solid rgba(80,140,255,0.18);
  background:rgba(3,10,24,0.62);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:all .18s;
}
.day-tab:hover{background:rgba(20,50,120,0.45);border-color:rgba(80,140,255,0.38)}
.day-tab.active{background:rgba(192,40,28,0.32);border-color:rgba(192,40,28,0.65);box-shadow:0 0 20px rgba(192,40,28,0.25)}
.day-name{font-size:0.6rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(143,170,210,0.65)}
.day-tab.active .day-name{color:rgba(255,160,140,0.92)}
.day-num{font-family:"Barlow Condensed",sans-serif;font-size:1.15rem;font-weight:700;color:#fff;line-height:1}
.day-today-dot{width:4px;height:4px;border-radius:50%;background:#40d090;margin:2px auto 0}

/* CARDS AREA */
.cards-area{max-width:1100px;margin:0 auto;padding:0.9rem 1.4rem 2.5rem}
.day-panel{display:none}
.day-panel.active{display:block;animation:panel-in 0.28s ease}
@keyframes panel-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.day-header{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.8rem}
.day-header-date{
  font-family:"Barlow Condensed",sans-serif;font-size:1.4rem;font-weight:700;
  color:#fff;text-transform:uppercase;letter-spacing:0.04em;
  text-shadow:0 2px 20px rgba(0,0,0,0.95);
}
.day-header-badge{font-size:0.6rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:rgba(64,208,144,0.15);color:#40d090;border:1px solid rgba(64,208,144,0.28)}

.nota-card{
  border-radius:11px;border:1px solid rgba(255,200,80,0.15);
  background:rgba(3,10,24,0.78);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:0.65rem 0.9rem;display:flex;gap:0.55rem;align-items:flex-start;margin-bottom:0.85rem;
}
.nota-icon{font-size:0.85rem;flex-shrink:0;margin-top:1px}
.nota-text{font-size:0.72rem;color:rgba(255,210,120,0.82);line-height:1.55}

.section-label{
  font-size:0.6rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;
  color:rgba(200,160,255,0.65);margin:0.9rem 0 0.5rem;padding-left:2px;
  text-shadow:0 1px 10px rgba(0,0,0,0.9);
}

/* GRID LADO A LADO */
.options-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0.7rem}
.lanche-grid{display:grid;grid-template-columns:1fr;gap:0.7rem}
.lanche-grid .option-card{border-color:rgba(140,80,220,0.38);background:rgba(20,5,50,0.72)}

.option-card{
  border-radius:14px;
  border:1px solid rgba(80,140,255,0.15);
  background:rgba(3,10,24,0.68);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .18s,background .18s,transform .12s;
  box-shadow:0 4px 24px rgba(0,0,0,0.45),inset 0 1px 0 rgba(80,140,255,0.08);
}
.option-card:hover{
  background:rgba(3,10,24,0.82);
  border-color:rgba(80,140,255,0.3);
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(0,0,0,0.5),0 0 20px rgba(80,140,255,0.1);
}

.option-header{display:flex;align-items:center;gap:0.65rem;padding:0.8rem 0.9rem 0.55rem}
.option-tag{font-size:0.57rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border-radius:5px;flex-shrink:0}
.tag-principal{background:rgba(20,50,130,0.75);color:rgba(140,200,255,0.95);border:1px solid rgba(80,140,255,0.32)}
.tag-light{background:rgba(16,100,80,0.65);color:rgba(80,220,160,0.95);border:1px solid rgba(20,160,120,0.35)}
.tag-carne{background:rgba(192,40,28,0.48);color:rgba(255,160,140,0.95);border:1px solid rgba(192,40,28,0.4)}
.tag-massa{background:rgba(100,60,10,0.65);color:rgba(255,200,100,0.95);border:1px solid rgba(180,120,20,0.35)}
.tag-lanche{background:rgba(80,20,140,0.7);color:rgba(200,160,255,0.95);border:1px solid rgba(140,80,220,0.42)}

.option-name{font-size:0.9rem;font-weight:600;color:#fff;line-height:1.3;flex:1}
.option-body{padding:0 0.9rem 0.8rem;display:flex;flex-direction:column;gap:0.22rem;flex:1}
.option-detail{font-size:0.73rem;color:rgba(143,170,210,0.72);line-height:1.5;display:flex;align-items:flex-start;gap:0.35rem}
.option-detail::before{content:"·";color:rgba(192,40,28,0.78);font-size:1rem;line-height:1.2;flex-shrink:0}
</style>
</head>

function getWeekDates(off=0){
  const today=new Date(),day=today.getDay(),mon=new Date(today);
  mon.setDate(today.getDate()-(day===0?6:day-1)+(off*7));
  return Array.from({length:5},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}

let weekOffset=0;
function buildUI(){
  const dates=getWeekDates(weekOffset),today=new Date();
  const f=dates[0],l=dates[4];
  document.getElementById("weekRange").textContent=
    f.getDate()+"/"+(f.getMonth()+1).toString().padStart(2,"0")+" – "+
    l.getDate()+"/"+(l.getMonth()+1).toString().padStart(2,"0")+"/"+l.getFullYear();
  const jan1=new Date(today.getFullYear(),0,1);
  document.getElementById("weekBadge").textContent="Semana "+Math.ceil(((today-jan1)/86400000+jan1.getDay()+1)/7);
  const tabsEl=document.getElementById("dayTabs");
  tabsEl.innerHTML="";
  let def=null;
  DIAS_KEY.forEach((key,i)=>{
    const d=dates[i],isToday=d.toDateString()===today.toDateString()&&weekOffset===0;
    if(isToday)def=key;
    const t=document.createElement("div");
    t.className="day-tab"+(isToday?" today":"");
    t.dataset.day=key;
    t.innerHTML="<span class=\"day-name\">"+["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][d.getDay()]+"</span><span class=\"day-num\">"+d.getDate()+"</span>"+(isToday?"<div class=\"day-today-dot\"></div>":"");
    t.addEventListener("click",()=>setDay(key,dates));
    tabsEl.appendChild(t);
  });
  setDay(def||"seg",dates);
}

function setDay(key,dates){
  const idx=DIAS_KEY.indexOf(key),d=dates[idx],today=new Date();
  document.querySelectorAll(".day-tab").forEach(t=>t.classList.toggle("active",t.dataset.day===key));
  const area=document.getElementById("cardsArea");
  area.innerHTML="";
  const data=CARDAPIO[key];
  if(!data)return;
  const panel=document.createElement("div");
  panel.className="day-panel active";
  const isToday=d.toDateString()===today.toDateString()&&weekOffset===0;
  panel.innerHTML="<div class=\"day-header\"><span class=\"day-header-date\">"+data.label+", "+d.getDate()+" de "+MESES[d.getMonth()]+"</span>"+(isToday?"<span class=\"day-header-badge\">Hoje</span>":"")+"</div>";
  const nota=document.createElement("div");
  nota.className="nota-card";
  nota.innerHTML="<span class=\"nota-icon\">ℹ️</span><span class=\"nota-text\"><strong>Carne</strong> substitui apenas a proteína · <strong>Light</strong> muda o cardápio completo · <strong>Massa</strong> inclui somente a massa do dia.</span>";
  panel.appendChild(nota);
  const grid=document.createElement("div");
  grid.className="options-grid";
  data.opcoes.forEach(op=>{
    const card=document.createElement("div");
    card.className="option-card";
    card.innerHTML="<div class=\"option-header\"><span class=\"option-tag "+op.tagClass+"\">"+op.tag+"</span><span class=\"option-name\">"+op.nome+"</span></div><div class=\"option-body\">"+op.detalhes.map(x=>"<div class=\"option-detail\">"+x+"</div>").join("")+"</div>";
    grid.appendChild(card);
  });
  panel.appendChild(grid);
  if(data.lanche){
    const lbl=document.createElement("div");
    lbl.className="section-label";
    lbl.textContent="🍔  Opção de lanche — exclusivo da sexta";
    panel.appendChild(lbl);
    const lg=document.createElement("div");
    lg.className="lanche-grid";
    data.lanche.forEach(op=>{
      const card=document.createElement("div");
      card.className="option-card";
      card.innerHTML="<div class=\"option-header\"><span class=\"option-tag "+op.tagClass+"\">"+op.tag+"</span><span class=\"option-name\">"+op.nome+"</span></div><div class=\"option-body\">"+op.detalhes.map(x=>"<div class=\"option-detail\">"+x+"</div>").join("")+"</div>";
      lg.appendChild(card);
    });
    panel.appendChild(lg);
  }
  area.appendChild(panel);
}

document.getElementById("prevWeek").addEventListener("click",()=>{weekOffset--;buildUI();});
document.getElementById("nextWeek").addEventListener("click",()=>{weekOffset++;buildUI();});
buildUI();
</script>
