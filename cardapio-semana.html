<html lang="pt-BR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;font-family:"Barlow",sans-serif;color:#e8f0ff;background:#040c1a;overflow-x:hidden}

body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 42% at 18% 8%,rgba(35,98,210,.20),transparent 60%),
    radial-gradient(ellipse 62% 40% at 88% 88%,rgba(24,190,125,.12),transparent 64%),
    radial-gradient(ellipse 50% 34% at 50% 105%,rgba(192,40,28,.10),transparent 70%),
    linear-gradient(180deg,#040c1a 0%,#041126 58%,#030912 100%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(72,138,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(72,138,255,.045) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,.25));
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,.25));
}

.homy-tech-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#homyTechCanvas{position:absolute;inset:0;width:100%;height:100%;opacity:.82}
.homy-scan-line{
  position:absolute;left:-20%;right:-20%;top:-12%;height:160px;
  background:linear-gradient(180deg,transparent,rgba(80,170,255,.055),rgba(34,200,121,.03),transparent);
  transform:rotate(-7deg);
  animation:homyScanMove 11s ease-in-out infinite;
}
@keyframes homyScanMove{0%{top:-20%;opacity:0}16%{opacity:1}70%{opacity:.75}100%{top:108%;opacity:0}}
.homy-chem-symbol{position:absolute;width:150px;height:132px;opacity:.12;filter:drop-shadow(0 0 22px rgba(80,170,255,.25));animation:homyChemFloat 12s ease-in-out infinite alternate;}
.homy-chem-symbol.s1{left:8%;top:14%;animation-duration:15s}
.homy-chem-symbol.s2{right:8%;top:16%;animation-duration:18s;transform:scale(.8) rotate(18deg)}
.homy-chem-symbol.s3{left:52%;bottom:7%;animation-duration:20s;transform:scale(1.15) rotate(-10deg)}
.homy-chem-symbol::before{content:"";position:absolute;inset:18px;border:1px solid rgba(122,190,255,.52);clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%);}
.homy-chem-symbol::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:rgba(34,200,121,.75);box-shadow:-48px -42px 0 rgba(97,184,255,.75),48px -42px 0 rgba(97,184,255,.7),65px 0 0 rgba(192,40,28,.68),48px 42px 0 rgba(97,184,255,.72),-48px 42px 0 rgba(97,184,255,.72),-65px 0 0 rgba(34,200,121,.65);}
@keyframes homyChemFloat{0%{translate:0 0;opacity:.08}50%{translate:14px -18px;opacity:.16}100%{translate:-10px 12px;opacity:.11}}

.header,.week-nav,.day-tabs-wrap,.cards-area{position:relative;z-index:1}

/* HEADER */
.header{position:sticky;top:0;z-index:50;background:rgba(5,15,34,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08)}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:0.9rem;padding:0.8rem 1.4rem}
.back-btn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8fa0be;font-size:1.3rem;text-decoration:none;flex-shrink:0;transition:background .15s}
.back-btn:hover{background:rgba(255,255,255,0.1)}
.header-logo{width:32px;height:32px;object-fit:contain;flex-shrink:0}
.header-titles{flex:1}
.header-title{font-family:"Barlow Condensed",sans-serif;font-size:1.15rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#fff;line-height:1}
.header-sub{font-size:0.7rem;color:rgba(143,170,210,0.55);letter-spacing:0.14em;text-transform:uppercase;margin-top:2px}
.week-badge{font-size:0.65rem;font-weight:600;letter-spacing:0.06em;background:rgba(26,58,110,0.6);border:1px solid rgba(60,140,255,0.28);color:rgba(140,200,255,0.9);padding:5px 10px;border-radius:6px;white-space:nowrap}

/* WEEK NAV */
.week-nav{max-width:1100px;margin:0 auto;padding:1rem 1.4rem 0.6rem;display:flex;align-items:center;justify-content:space-between}
.week-nav-btn{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8fa0be;font-size:1rem;transition:background .15s;user-select:none}
.week-nav-btn:hover{background:rgba(26,58,110,0.4)}
.week-label{font-size:0.85rem;font-weight:500;color:rgba(200,220,255,0.85);letter-spacing:0.05em}

/* DAY TABS */
.day-tabs-wrap{padding:0 1.4rem;max-width:1100px;margin:0 auto}
.day-tabs{display:flex;gap:0.5rem;overflow-x:auto;padding-bottom:0.5rem;scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex:1;min-width:80px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0.6rem 0.6rem;border-radius:12px;cursor:pointer;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);transition:all .18s}
.day-tab:hover{background:rgba(26,58,110,0.3);border-color:rgba(60,140,255,0.25)}
.day-tab.active{background:rgba(192,40,28,0.25);border-color:rgba(192,40,28,0.55);box-shadow:0 0 18px rgba(192,40,28,0.2)}
.day-name{font-size:0.65rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(143,170,210,0.65)}
.day-tab.active .day-name{color:rgba(255,160,140,0.9)}
.day-num{font-family:"Barlow Condensed",sans-serif;font-size:1.4rem;font-weight:700;color:#fff;line-height:1}
.day-today-dot{width:5px;height:5px;border-radius:50%;background:#40d090;margin:2px auto 0}

/* CARDS */
.cards-area{max-width:1100px;margin:0 auto;padding:1rem 1.4rem 3rem}
.day-panel{display:none}
.day-panel.active{display:block;animation:panel-in 0.28s ease}
@keyframes panel-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.day-header{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.9rem}
.day-header-date{font-family:"Barlow Condensed",sans-serif;font-size:1.7rem;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:0.04em}
.day-header-badge{font-size:0.65rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border-radius:5px;background:rgba(64,208,144,0.15);color:#40d090;border:1px solid rgba(64,208,144,0.28)}

.nota-card{border-radius:11px;border:1px solid rgba(255,200,80,0.15);background:rgba(255,180,0,0.05);padding:0.75rem 1rem;display:flex;gap:0.6rem;align-items:flex-start;margin-bottom:1rem}
.nota-icon{font-size:0.9rem;flex-shrink:0;margin-top:1px}
.nota-text{font-size:0.82rem;color:rgba(255,210,120,0.82);line-height:1.55}

.options-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0.8rem}

/* CARD */
.option-card{border-radius:16px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .18s,background .18s,transform .12s,box-shadow .18s;box-shadow:0 2px 12px rgba(0,0,0,0.2);}
.option-card:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.2);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.3);}
.option-card:active{transform:scale(0.98)}

.option-header{display:flex;align-items:center;gap:0.7rem;padding:1rem 1rem 0.7rem}
.option-tag{font-size:0.62rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:4px 9px;border-radius:5px;flex-shrink:0}
.tag-principal{background:rgba(26,58,110,0.7);color:rgba(140,200,255,0.95);border:1px solid rgba(60,140,255,0.3)}
.tag-light{background:rgba(16,110,90,0.6);color:rgba(80,220,160,0.95);border:1px solid rgba(16,160,120,0.35)}
.tag-carne{background:rgba(192,40,28,0.45);color:rgba(255,160,140,0.95);border:1px solid rgba(192,40,28,0.38)}
.tag-massa{background:rgba(100,60,10,0.6);color:rgba(255,200,100,0.95);border:1px solid rgba(180,120,20,0.35)}
.tag-lanche{background:rgba(80,20,140,0.65);color:rgba(200,160,255,0.95);border:1px solid rgba(140,80,220,0.4)}

.option-name{font-size:1.05rem;font-weight:600;color:#fff;line-height:1.3;flex:1}
.option-body{padding:0 1rem 0.9rem;display:flex;flex-direction:column;gap:0.28rem;flex:1}
.option-detail{font-size:0.82rem;color:rgba(143,170,210,0.72);line-height:1.55;display:flex;align-items:flex-start;gap:0.4rem}
.option-detail::before{content:"·";color:rgba(192,40,28,0.75);font-size:1.1rem;line-height:1.2;flex-shrink:0}
.option-hint{padding:0 1rem 0.8rem;font-size:0.68rem;color:rgba(100,150,255,0.45);letter-spacing:0.06em}

/* MODAL — position:fixed garante popup na frente */
.modal-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(3,8,20,0.82);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  padding:1.5rem;
  opacity:0;pointer-events:none;
  transition:opacity 0.22s ease;
}
.modal-overlay.open{opacity:1;pointer-events:all}

.modal-box{
  background:#0b1a35;
  border:1px solid rgba(255,255,255,0.12);
  border-radius:22px;
  width:100%;max-width:520px;
  box-shadow:0 24px 80px rgba(0,0,0,0.7),inset 0 1px 0 rgba(255,255,255,0.08);
  overflow:hidden;
  transform:scale(0.92) translateY(16px);
  transition:transform 0.25s cubic-bezier(.22,1,.36,1);
}
.modal-overlay.open .modal-box{transform:scale(1) translateY(0)}

.modal-header{display:flex;align-items:center;gap:0.8rem;padding:1.4rem 1.4rem 1rem;border-bottom:1px solid rgba(255,255,255,0.07);}
.modal-tag{font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:5px 11px;border-radius:6px;flex-shrink:0}
.modal-title{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;font-weight:700;color:#fff;line-height:1.2;flex:1}
.modal-close{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8fa0be;font-size:1.1rem;flex-shrink:0;transition:background .15s}
.modal-close:hover{background:rgba(192,40,28,0.3);color:#fff}

.modal-body{padding:1.2rem 1.4rem 1.6rem;display:flex;flex-direction:column;gap:0.55rem;max-height:65vh;overflow-y:auto}
.modal-detail{display:flex;align-items:flex-start;gap:0.7rem;padding:0.7rem 0.9rem;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);}
.modal-detail::before{content:"✓";color:#40d090;font-size:0.85rem;flex-shrink:0;margin-top:1px;font-weight:700}
.modal-detail-text{font-size:0.95rem;color:rgba(200,220,255,0.88);line-height:1.5}
.modal-note{margin-top:0.4rem;padding:0.7rem 0.9rem;border-radius:10px;background:rgba(255,180,0,0.05);border:1px solid rgba(255,200,80,0.12);font-size:0.78rem;color:rgba(255,210,120,0.75);line-height:1.5;}
.modal-empty{padding:0.7rem 0.9rem;font-size:0.88rem;color:rgba(143,170,210,0.5);font-style:italic}
</style>

<script>
// ── Carrega MSAL + sharepoint.js ────────────────────────────────────────────
window.HOMY_SP_READY = (function(){
  function loadScript(src){
    return new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = function(){ reject(new Error("Falha ao carregar: " + src)); };
      document.head.appendChild(s);
    });
  }
  return loadScript("https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js")
    .catch(function(){
      return loadScript("https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js");
    })
    .then(function(){
      if (!window.msal) throw new Error("MSAL não ficou disponível.");
      return loadScript("sharepoint.js?v=" + Date.now());
    })
    .then(function(){
      if (!window.SP) throw new Error("sharepoint.js não ficou disponível.");
      return window.SP;
    });
})();
</script>

<script>
// ── Constantes ───────────────────────────────────────────────────────────────
const DIAS_KEY    = ["seg","ter","qua","qui","sex"];
const DIAS_LABEL  = {seg:"Segunda",ter:"Terça",qua:"Quarta",qui:"Quinta",sex:"Sexta"};
const MESES       = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const TAG_CLASS   = {principal:"tag-principal",light:"tag-light",carne:"tag-carne",massa:"tag-massa",lanche:"tag-lanche"};
const TAG_LABEL   = {principal:"Principal",light:"Light",carne:"Carne",massa:"Massa",lanche:"Lanche"};
const ORDEM_OPCOES = ["principal","light","carne","massa","lanche"];

// Textos que NUNCA devem aparecer como detalhe para o colaborador
const DETALHES_BLOQUEADOS = [
  /extraído (do|automaticamente)/i,
  /extraido/i,
  /pdf vascon/i,
  /cardápio (não cadastrado|acima está sujeito)/i,
  /procure a (luana|ti)/i,
  /^-+$/,
  /^\s*$/
];

let weekOffset = 0;
let CARDAPIO   = {seg:[],ter:[],qua:[],qui:[],sex:[]};
let DATAS      = [];

// ── Utilitários ──────────────────────────────────────────────────────────────
function esc(v){
  return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function norm(v){
  return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}

function pick(obj,...keys){
  for(const k of keys){ if(obj && obj[k] != null) return obj[k]; }
  return "";
}

function normDia(v){
  const s = norm(v);
  if(s.startsWith("seg")) return "seg";
  if(s.startsWith("ter")) return "ter";
  if(s.startsWith("qua")) return "qua";
  if(s.startsWith("qui")) return "qui";
  if(s.startsWith("sex")) return "sex";
  return "";
}

function normOpcao(v){
  const s = norm(v);
  if(s.startsWith("prin")) return "principal";
  if(s.startsWith("lig"))  return "light";
  if(s.startsWith("car"))  return "carne";
  if(s.startsWith("mas"))  return "massa";
  if(s.startsWith("lan"))  return "lanche";
  return "principal";
}

function ehDetalheSujo(texto){
  return DETALHES_BLOQUEADOS.some(rx => rx.test(String(texto||"")));
}

function ehObsVascon(texto){
  const n = norm(texto);
  return n.includes("cardapio acima esta sujeito") ||
         n.includes("sujeito a alteracoes") ||
         n.includes("opcoes carne e massa substituem") ||
         n.includes("opcao carne substitui") ||
         n.includes("opcao massa substitui") ||
         n.includes("opcoes light e lanche substituem") ||
         n.includes("opcao light substitui") ||
         n.includes("opcao lanche substitui") ||
         n.includes("esta opcao substitui");
}

function splitDetalhes(v){
  return String(v||"")
    .replace(/\r/g,"\n")
    .split(/\n|;/)
    .map(x => x.replace(/^[-•·\s]+/,"").trim())
    .filter(x => x.length > 1 && !ehDetalheSujo(x));
}

// ── Observações fixas da Vascon por opção ────────────────────────────────────
// Aparecem no modal como nota de rodapé, nunca no card preview
const OBS_VASCON = {
  principal: "O cardápio acima está sujeito a alterações.",
  light:     "A opção Light substitui o prato principal completo.\nO cardápio acima está sujeito a alterações.",
  lanche:    "A opção Lanche substitui o prato principal completo.\nO cardápio acima está sujeito a alterações.",
  carne:     "A opção Carne substitui a carne do prato principal.\nO cardápio acima está sujeito a alterações.",
  massa:     "A opção Massa substitui a carne do prato principal.\nO cardápio acima está sujeito a alterações."
};

// ── Normaliza 1 item do SharePoint para o formato da tela ────────────────────
const NOMES_GENERICOS = [
  "prato principal", "principal", "light", "carne", "massa", "lanche",
  "cardapio nao cadastrado", "cardapio", "prato", "sem nome", ""
];

function ehNomeGenerico(v){
  return NOMES_GENERICOS.includes(norm(v));
}

function normalizarItem(item){
  const tag     = normOpcao(pick(item,"Opcao","opcao"));
  const nomeRaw = String(pick(item,"Nome_Prato","nomePrato","Prato","Title")||"").trim();
  const detRaw  = String(pick(item,"Detalhes","detalhes")||"").trim();

  let nome     = nomeRaw;
  // Remove detalhes sujos E observações Vascon que já vieram do SharePoint
  let detalhes = splitDetalhes(detRaw).filter(x => !ehObsVascon(x));

  // Caso 1: nome contém múltiplos itens separados por ; ou ·
  // (PDF Vascon importado assim) — primeiro item = nome, resto = detalhes
  if(nomeRaw.includes(";") || nomeRaw.includes(" · ")){
    const partes = nomeRaw.split(/;| · /).map(x => x.trim()).filter(Boolean);
    if(partes.length > 1){
      nome = partes[0];
      if(detalhes.length === 0){
        detalhes = partes.slice(1).filter(x => !ehDetalheSujo(x) && !ehObsVascon(x));
      }
    }
  }

  // Caso 2: nome é "Prato Principal" (genérico) — o nome real É o próprio
  // campo Detalhes, que contém o cardápio completo do dia.
  // Neste caso exibimos "Cardápio do Dia" como título e os detalhes embaixo.
  if(ehNomeGenerico(nome) && detalhes.length > 0){
    // Para o principal: o nome visual fica "Cardápio do Dia"
    // e todos os detalhes ficam listados abaixo
    if(tag === "principal"){
      nome = "Cardápio do Dia";
    } else {
      // Para carne/massa/light/lanche: o primeiro detalhe é o prato
      nome     = detalhes[0];
      detalhes = detalhes.slice(1);
    }
  }

  // Caso 3: nome ainda genérico/vazio → fallback
  if(ehNomeGenerico(nome)){
    nome     = "Cardápio não cadastrado";
    detalhes = [];
  }

  return {
    tag,
    tagLabel: TAG_LABEL[tag] || tag,
    tagClass: TAG_CLASS[tag]  || "tag-principal",
    nome,
    detalhes,                           // só detalhes reais do prato
    aviso: OBS_VASCON[tag] || null      // observação separada — só no modal
  };
}

// ── Deduplica por (semana, dia, opcao) ───────────────────────────────────────
function deduplicar(items){
  const mapa = new Map();
  for(const item of items||[]){
    const semana = String(pick(item,"Semana_id","SemanaId")||"").trim();
    const dia    = normDia(pick(item,"Dia","dia"));
    const opcao  = normOpcao(pick(item,"Opcao","opcao"));
    if(!dia) continue;
    const key = semana+"|"+dia+"|"+opcao;
    if(!mapa.has(key)){
      mapa.set(key, item);
    } else {
      // Prefere o item com mais detalhes
      const det = String(pick(item,"Detalhes","detalhes")||"");
      const cur  = String(pick(mapa.get(key),"Detalhes","detalhes")||"");
      if(det.length > cur.length) mapa.set(key, item);
    }
  }
  return Array.from(mapa.values());
}

function ordenar(lista){
  return [...lista].sort((a,b)=>{
    const ia = ORDEM_OPCOES.indexOf(a.tag);
    const ib = ORDEM_OPCOES.indexOf(b.tag);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
}

// ── Modal ────────────────────────────────────────────────────────────────────
function abrirModal(op){
  document.getElementById("modalTag").textContent   = op.tagLabel;
  document.getElementById("modalTag").className     = "modal-tag "+op.tagClass;
  document.getElementById("modalTitle").textContent = op.nome;

  const body = document.getElementById("modalBody");
  // detalhes são sempre limpos (sem obs Vascon)
  const dets = (op.detalhes||[]);
  // aviso vem do campo separado, não dos detalhes
  const aviso = op.aviso || null;

  let html = "";
  if(dets.length){
    html += dets.map(d =>
      '<div class="modal-detail"><span class="modal-detail-text">'+esc(d)+'</span></div>'
    ).join("");
  } else {
    html += '<div class="modal-empty">Sem detalhes adicionais cadastrados.</div>';
  }
  if(aviso){
    html += '<div class="modal-note">'+esc(aviso)+'</div>';
  }
  body.innerHTML = html;

  const overlay = document.getElementById("modalOverlay");
  overlay.style.display = "flex";
  // Força reflow antes de adicionar a classe para a transição funcionar
  overlay.offsetHeight;
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
}

function fecharModal(){
  const overlay = document.getElementById("modalOverlay");
  overlay.classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("modalClose").addEventListener("click", fecharModal);
document.getElementById("modalOverlay").addEventListener("click", function(e){
  if(e.target === this) fecharModal();
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") fecharModal();
});

// ── Card ─────────────────────────────────────────────────────────────────────
function makeCard(op){
  // Preview: detalhes reais do prato, máximo 5 linhas
  // op.aviso NÃO aparece aqui — só no modal
  const preview = (op.detalhes||[]).slice(0, 5);

  const card = document.createElement("div");
  card.className = "option-card";
  card.innerHTML =
    '<div class="option-header">' +
      '<span class="option-tag '+esc(op.tagClass)+'">'+esc(op.tagLabel)+'</span>' +
      '<span class="option-name">'+esc(op.nome)+'</span>' +
    '</div>' +
    (preview.length
      ? '<div class="option-body">' +
          preview.map(x => '<div class="option-detail">'+esc(x)+'</div>').join("") +
        '</div>'
      : '') +
    '<div class="option-hint">Toque para ver detalhes</div>';

  card.addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    abrirModal(op);
  });

  return card;
}

// ── Renderização ─────────────────────────────────────────────────────────────
function renderTabs(){
  const hoje = new Date();
  const f = DATAS[0], l = DATAS[4];

  document.getElementById("weekRange").textContent =
    f.getDate()+"/"+String(f.getMonth()+1).padStart(2,"0")+
    " – "+
    l.getDate()+"/"+String(l.getMonth()+1).padStart(2,"0")+"/"+l.getFullYear();

  const semId = SP && SP.getSemanaId ? SP.getSemanaId(f) : "";
  document.getElementById("weekBadge").textContent =
    "Semana "+(semId.split("-W")[1]||"");

  const tabs = document.getElementById("dayTabs");
  tabs.innerHTML = "";
  let diaAtivo = "seg";

  DIAS_KEY.forEach((key, i) => {
    const d = DATAS[i];
    const isToday = d.toDateString() === hoje.toDateString();
    if(isToday) diaAtivo = key;

    const t = document.createElement("div");
    t.className = "day-tab"+(isToday?" today":"");
    t.dataset.day = key;
    t.innerHTML =
      '<span class="day-name">'+["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][d.getDay()]+'</span>'+
      '<span class="day-num">'+d.getDate()+'</span>'+
      (isToday?'<div class="day-today-dot"></div>':"");

    t.addEventListener("click", () => setDay(key));
    tabs.appendChild(t);
  });

  setDay(diaAtivo);
}

function setDay(key){
  const idx = DIAS_KEY.indexOf(key);
  if(idx < 0) return;
  const d = DATAS[idx];
  const hoje = new Date();

  document.querySelectorAll(".day-tab")
    .forEach(t => t.classList.toggle("active", t.dataset.day === key));

  const area = document.getElementById("cardsArea");
  area.innerHTML = "";

  const panel = document.createElement("div");
  panel.className = "day-panel active";

  const isToday = d.toDateString() === hoje.toDateString();
  panel.innerHTML =
    '<div class="day-header">' +
      '<span class="day-header-date">'+DIAS_LABEL[key]+", "+d.getDate()+" de "+MESES[d.getMonth()]+'</span>'+
      (isToday?'<span class="day-header-badge">Hoje</span>':"") +
    '</div>';

  const itens = ordenar(CARDAPIO[key]||[]);

  if(!itens.length){
    panel.innerHTML +=
      '<div class="nota-card"><span class="nota-icon">ℹ️</span>'+
      '<span class="nota-text">Nenhum cardápio cadastrado para este dia.</span></div>';
    area.appendChild(panel);
    return;
  }

  const grid = document.createElement("div");
  grid.className = "options-grid";
  itens.forEach(op => grid.appendChild(makeCard(op)));
  panel.appendChild(grid);
  area.appendChild(panel);
}

// ── Carregamento principal ───────────────────────────────────────────────────
async function carregarSemana(){
  document.getElementById("cardsArea").innerHTML =
    '<div class="nota-card"><span class="nota-icon">⏳</span>'+
    '<span class="nota-text">Carregando cardápio...</span></div>';

  try{
    await window.HOMY_SP_READY;
    await SP.ensureLogin();

    // Calcula data base
    const base = new Date();
    base.setDate(base.getDate() + weekOffset * 7);
    const semanaId = SP.getSemanaId(base);
    DATAS = SP.getWeekDates(semanaId);
    CARDAPIO = {seg:[],ter:[],qua:[],qui:[],sex:[]};

    let itens = await SP.getCardapio(semanaId);
    itens = deduplicar(itens);

    itens.forEach(item => {
      const dia = normDia(pick(item,"Dia","dia"));
      if(!CARDAPIO[dia]) return;
      CARDAPIO[dia].push(normalizarItem(item));
    });

    DIAS_KEY.forEach(dia => {
      CARDAPIO[dia] = ordenar(CARDAPIO[dia]);
    });

    renderTabs();

  } catch(e){
    console.error("Erro ao carregar cardápio:", e);
    document.getElementById("cardsArea").innerHTML =
      '<div class="nota-card"><span class="nota-icon">⚠️</span>'+
      '<span class="nota-text">Não foi possível conectar ao SharePoint. Verifique o login Microsoft.</span></div>';
  }
}

document.getElementById("prevWeek").addEventListener("click", () => { weekOffset--; carregarSemana(); });
document.getElementById("nextWeek").addEventListener("click", () => { weekOffset++; carregarSemana(); });

carregarSemana();
</script>

<script>
// ── Fundo animado Homy Tech ──────────────────────────────────────────────────
(function iniciarFundo(){
  const canvas = document.getElementById("homyTechCanvas");
  if(!canvas || canvas.dataset.started === "true") return;
  canvas.dataset.started = "true";

  const ctx = canvas.getContext("2d");
  let w=0, h=0, dpr=1, particles=[];

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
    canvas.style.width = w+"px"; canvas.style.height = h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const qtd = Math.max(46, Math.min(82, Math.floor(w/22)));
    particles = Array.from({length:qtd},(_,i)=>criarP(i));
  }

  function criarP(i){
    const tipo = i%11===0?"red":i%5===0?"green":"blue";
    return {
      x:Math.random()*w, y:Math.random()*h,
      vx:(Math.random()-.5)*.34, vy:(Math.random()-.5)*.28,
      r: tipo==="red"?2.4:tipo==="green"?2.7:2.1+Math.random()*1.4,
      tipo, fase:Math.random()*Math.PI*2
    };
  }

  function cor(p,a){
    if(p.tipo==="red")   return `rgba(192,40,28,${a})`;
    if(p.tipo==="green") return `rgba(34,200,121,${a})`;
    return `rgba(97,184,255,${a})`;
  }

  function hex(t){
    [{x:w*.18,y:h*.18,s:58,a:.16},{x:w*.82,y:h*.24,s:74,a:.12},{x:w*.62,y:h*.78,s:86,a:.10}]
    .forEach((m,idx)=>{
      ctx.save();
      ctx.translate(m.x+Math.sin(t/1700+idx)*18, m.y+Math.cos(t/2100+idx)*14);
      ctx.rotate(Math.sin(t/3600+idx)*.18);
      ctx.strokeStyle=`rgba(97,184,255,${m.a})`; ctx.lineWidth=1;
      ctx.beginPath();
      for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;i===0?ctx.moveTo(Math.cos(a)*m.s,Math.sin(a)*m.s):ctx.lineTo(Math.cos(a)*m.s,Math.sin(a)*m.s);}
      ctx.closePath(); ctx.stroke();
      for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;ctx.beginPath();ctx.arc(Math.cos(a)*m.s,Math.sin(a)*m.s,3.2,0,Math.PI*2);ctx.fillStyle=i%3===0?"rgba(34,200,121,.22)":"rgba(97,184,255,.24)";ctx.fill();}
      ctx.restore();
    });
  }

  function loop(t){
    ctx.clearRect(0,0,w,h); hex(t);
    for(const p of particles){
      p.x+=p.vx+Math.sin(t/1800+p.fase)*.055;
      p.y+=p.vy+Math.cos(t/2200+p.fase)*.045;
      if(p.x<-20)p.x=w+20; if(p.x>w+20)p.x=-20;
      if(p.y<-20)p.y=h+20; if(p.y>h+20)p.y=-20;
    }
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const a=particles[i],b=particles[j];
        const dx=a.x-b.x,dy=a.y-b.y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<145){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(97,184,255,${(1-dist/145)*.22})`;ctx.lineWidth=.8;ctx.stroke();}
      }
    }
    for(const p of particles){
      const pulse=.65+Math.sin(t/650+p.fase)*.35;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r+pulse*.8,0,Math.PI*2);
      ctx.fillStyle=cor(p,.62);ctx.shadowColor=p.tipo==="green"?"rgba(34,200,121,.75)":p.tipo==="red"?"rgba(192,40,28,.72)":"rgba(97,184,255,.75)";ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
