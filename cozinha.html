<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#040c1a;--surface:rgba(255,255,255,.045);--surface2:rgba(10,31,60,.58);
  --border:rgba(255,255,255,.09);--border2:rgba(80,150,255,.24);
  --text:#e8f0ff;--muted:rgba(143,170,210,.64);--blue:#61b8ff;--red:#c0281c;--green:#22c879;
}
html,body{min-height:100%;background:var(--bg);font-family:Barlow,sans-serif;color:var(--text);overflow-x:hidden}
body:before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 42% at 18% 8%,rgba(35,98,210,.20),transparent 60%),
    radial-gradient(ellipse 62% 40% at 88% 88%,rgba(24,190,125,.12),transparent 64%),
    radial-gradient(ellipse 50% 34% at 50% 105%,rgba(192,40,28,.10),transparent 70%),
    linear-gradient(180deg,#040c1a 0%,#041126 58%,#030912 100%);
}
body:after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(72,138,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(72,138,255,.045) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,.25));
}
.tech-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#techCanvas{position:absolute;inset:0;width:100%;height:100%;opacity:.82}
.scan-line{
  position:absolute;left:-20%;right:-20%;top:-12%;height:160px;
  background:linear-gradient(180deg,transparent,rgba(80,170,255,.055),rgba(34,200,121,.03),transparent);
  transform:rotate(-7deg);
  animation:scanMove 11s ease-in-out infinite;
}
@keyframes scanMove{
  0%{top:-20%;opacity:0}
  16%{opacity:1}
  70%{opacity:.75}
  100%{top:108%;opacity:0}
}
.chem-symbol{
  position:absolute;width:150px;height:132px;opacity:.12;
  filter:drop-shadow(0 0 22px rgba(80,170,255,.25));
  animation:chemFloat 12s ease-in-out infinite alternate;
}
.chem-symbol.s1{left:8%;top:14%;animation-duration:15s}
.chem-symbol.s2{right:8%;top:16%;animation-duration:18s;transform:scale(.8) rotate(18deg)}
.chem-symbol.s3{left:52%;bottom:7%;animation-duration:20s;transform:scale(1.15) rotate(-10deg)}
.chem-symbol::before{
  content:"";position:absolute;inset:18px;border:1px solid rgba(122,190,255,.52);
  clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%);
}
.chem-symbol::after{
  content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;
  background:rgba(34,200,121,.75);
  box-shadow:
    -48px -42px 0 rgba(97,184,255,.75),
    48px -42px 0 rgba(97,184,255,.7),
    65px 0 0 rgba(192,40,28,.68),
    48px 42px 0 rgba(97,184,255,.72),
    -48px 42px 0 rgba(97,184,255,.72),
    -65px 0 0 rgba(34,200,121,.65);
}
@keyframes chemFloat{
  0%{translate:0 0;opacity:.08}
  50%{translate:14px -18px;opacity:.16}
  100%{translate:-10px 12px;opacity:.11}
}
.app{position:relative;z-index:1;min-height:100vh;padding-bottom:2rem}
.header{position:sticky;top:0;z-index:10;background:rgba(4,12,26,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:.95rem 1rem .75rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.left{display:flex;align-items:center;gap:.75rem;min-width:0}
.btn-voltar{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.045);color:var(--text);font-size:.72rem;font-weight:700;text-transform:uppercase;text-decoration:none;display:flex;align-items:center;gap:.35rem}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.brand img{width:32px;height:32px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12)}
.brand-title{font-family:"Barlow Condensed";font-size:1.05rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.brand-sub{font-size:.62rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase}

.datebar{display:flex;align-items:baseline;gap:.7rem;margin-top:.65rem}

.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.055);color:var(--text);padding:0 42px 0 42px;font-size:.95rem;outline:none}
.search:before{content:"🔎";position:absolute;left:14px;top:10px;opacity:.7}
.clear{position:absolute;right:8px;top:7px;width:28px;height:28px;border:0;border-radius:8px;background:rgba(255,255,255,.06);color:var(--muted);cursor:pointer}
.counter{display:flex;align-items:center;justify-content:space-between;margin:.6rem 0 .55rem}
.counter-title{font-family:"Barlow Condensed";font-size:.82rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}

.list{display:flex;flex-direction:column;gap:.58rem}
.item{display:flex;align-items:center;gap:.9rem;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:.82rem .95rem;cursor:pointer;transition:.15s}
.item:hover{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.07)}
.item.done{background:rgba(34,200,121,.13);border-color:rgba(34,200,121,.32);cursor:default}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(26,100,200,.28);border:1px solid rgba(80,150,255,.28);font-family:"Barlow Condensed";font-weight:800;color:#9bd2ff}
.info{flex:1;min-width:0}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{font-size:.75rem;color:var(--muted);margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.06);color:var(--muted)}
.item.done .badge{background:rgba(34,200,121,.18);color:#40d090}
.empty,.error{display:flex;min-height:270px;align-items:center;justify-content:center;text-align:center;flex-direction:column;color:var(--muted);gap:.45rem}
.empty-icon{font-size:2.4rem;opacity:.45}
.empty-title{font-weight:800;color:rgba(180,205,240,.72)}
.empty-sub{font-size:.86rem;max-width:330px;line-height:1.45}
.connect{margin-top:.8rem;border:1px solid rgba(80,150,255,.28);background:rgba(26,100,200,.18);color:#9bd2ff;border-radius:10px;padding:.65rem 1rem;font-weight:800;cursor:pointer}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;background:#0d2010;border:1px solid rgba(34,200,121,.38);color:#40d090;border-radius:12px;padding:.7rem 1.1rem;font-weight:800;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal-bg{position:fixed;inset:0;background:rgba(4,12,26,.82);z-index:40;display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(8px)}
.modal-bg.open{display:flex}
.modal{width:100%;max-width:360px;background:#0a1628;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:1.5rem;text-align:center;box-shadow:0 22px 70px rgba(0,0,0,.5)}
.modal h3{font-family:"Barlow Condensed";font-size:1.3rem;text-transform:uppercase;letter-spacing:.05em;margin:.5rem 0}
.modal p{color:var(--muted);line-height:1.4;margin-bottom:1.2rem}
.modal-actions{display:flex;gap:.7rem}
.modal-actions button{flex:1;height:42px;border-radius:11px;border:1px solid var(--border);font-weight:800;cursor:pointer}
.cancel{background:rgba(255,255,255,.06);color:var(--muted)}
.confirm{background:linear-gradient(135deg,#22c879,#15834d);color:white}
@media(max-width:600px){.brand-title{font-size:.95rem}.weekday{font-size:1.35rem}.content{padding:.85rem}.btn-voltar span{display:none}}

}

<script>
window.HOMY_SP_READY = (function(){
  function loadScript(src){
    return new Promise(function(resolve,reject){
      var s=document.createElement("script");
      s.src=src;
      s.onload=resolve;
      s.onerror=function(){reject(new Error("Falha ao carregar: "+src));};
      document.head.appendChild(s);
    });
  }

  return loadScript("https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js")
    .catch(function(){
      return loadScript("https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js");
    })
    .then(function(){
      if(!window.msal) throw new Error("MSAL não ficou disponível no navegador.");
      return loadScript("sharepoint.js?v=homy-final-20260601-2").catch(function(){
        return loadScript("./sharepoint.js?v=homy-final-20260601-2");
      }).catch(function(){
        return loadScript("../sharepoint.js?v=homy-final-20260601-2");
      });
    })
    .then(function(){
      if(!window.SP) throw new Error("sharepoint.js não ficou disponível no navegador.");
      return window.SP;
    });
})();
</script>
<script>
const DIAS = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
const DIAS_CHAVE = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const DIAS_NORMAL = ["domingo","segunda","terca","quarta","quinta","sexta","sabado"];

let pedidosHoje = [];
let checkinsHoje = [];
let pedidoSelecionado = null;

function normalizar(v){
  return String(v || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
}

function hoje(){
  return new Date();
}

function semanaIdAtual(){
  if (window.SP && typeof window.SP.getCurrentWeekId === "function") return window.SP.getCurrentWeekId();
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const w1 = new Date(d.getFullYear(),0,4);
  const week = 1 + Math.round(((d - w1) / 86400000 - 3 + ((w1.getDay() + 6) % 7)) / 7);
  return `${d.getFullYear()}-W${String(week).padStart(2,"0")}`;
}

function diaAtual(){
  return DIAS_CHAVE[hoje().getDay()];
}

function atualizarData(){
  const d = hoje();
  document.getElementById("weekday").textContent = DIAS[d.getDay()];
  document.getElementById("fulldate").textContent =
    `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
}

function iniciais(nome){
  return String(nome || "?").split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join("").toUpperCase();
}

function itemValor(obj, ...keys){
  for (const k of keys) if (obj && obj[k] !== undefined && obj[k] !== null) return obj[k];
  return "";
}

function pedidoConta(p){
  const status = normalizar(itemValor(p, "Status", "status"));
  return !["cancelado","bloqueado","afastado","ferias","férias","nao vai almocar","não vai almoçar"].includes(status);
}

function getNome(p){
  return itemValor(p, "Colaborador_nome", "colaborador_nome", "Colaborador", "Title") || "Sem nome";
}

function getOpcao(p){
  return itemValor(p, "Opcao", "opcao", "Nome_Prato", "nomePrato") || "Principal";
}

function getPedidoId(p){
  return String(itemValor(p, "id", "ID"));
}

function getColaboradorId(p){
  return String(itemValor(p, "Colaborador_id", "colaborador_id"));
}

function isCheckinFeito(p){
  const pid = getPedidoId(p);
  const cid = getColaboradorId(p);

  return checkinsHoje.some(c => {
    const cPid = String(itemValor(c, "Pedido_id", "pedido_id"));
    const cCid = String(itemValor(c, "Colaborador_id", "colaborador_id"));
    const retirou = window.SP && window.SP.isTrue ? window.SP.isTrue(itemValor(c, "Retirou", "retirou")) : true;
    return retirou && ((pid && cPid === pid) || (cid && cCid === cid));
  });
}

async function carregarCardapio(semanaId, dia){
  try {
    const cardapio = await window.SP.getCardapio(semanaId);
    const itens = cardapio.filter(c => normalizar(itemValor(c,"Dia","dia")) === normalizar(dia));

    const box = document.getElementById("cardapioHoje");

    if (!itens.length) {
      box.innerHTML = "Nenhum cardápio cadastrado para hoje.";
      return;
    }

    box.innerHTML = `
      <div class="cozinha-cardapio-grid">
        ${itens.map(i => {
          const opcao = String(itemValor(i, "Opcao", "opcao") || "").toLowerCase();
          const nome = itemValor(i, "Nome_Prato", "nomePrato") || tituloOpcao(opcao);
          const detalhes = itemValor(i, "Detalhes", "detalhes", "Descricao", "descricao") || "";

          const linhas = String(detalhes)
            .split(/\r?\n|;/)
            .map(x => x.trim())
            .filter(Boolean);

          return `
            <article class="cozinha-cardapio-card">
              <div class="cozinha-cardapio-head">
                <span class="tag-${opcao}">${tituloOpcao(opcao)}</span>
                <strong>${nome}</strong>
              </div>
              <div class="cozinha-cardapio-body">
                ${linhas.map(l => `<div class="cozinha-cardapio-item">• ${l}</div>`).join("")}
              </div>
            </article>
          `;
        }).join("")}
      </div>
    `;
  } catch(e) {
    console.warn("Cardápio:", e);
    document.getElementById("cardapioHoje").textContent = "Não foi possível carregar o cardápio.";
  }
}

function tituloOpcao(opcao){
  const mapa = {
    principal: "Principal",
    light: "Light",
    carne: "Carne",
    massa: "Massa",
    lanche: "Lanche"
  };
  return mapa[String(opcao || "").toLowerCase()] || "Opção";
}
  
async function sincronizar(){
  atualizarData();

  const lista = document.getElementById("lista");
  lista.innerHTML = `<div class="empty"><div class="empty-icon">⏳</div><div class="empty-title">Atualizando...</div></div>`;

  try {
    if (!window.SP) throw new Error("sharepoint.js não carregado");

    await window.SP.init();

    if (!window.SP._account) {
      lista.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔐</div>
          <div class="empty-title">Conexão necessária</div>
          <div class="empty-sub">Entre uma vez com uma conta autorizada da Homy para acessar os dados com segurança, sem expor segredo no Git.</div>
          <button class="connect" onclick="conectar()">Conectar com Microsoft</button>
        </div>`;
      return;
    }

    const semanaId = semanaIdAtual();
    const dia = diaAtual();

    await carregarCardapio(semanaId, dia);

    const pedidos = await window.SP.getPedidos(semanaId);
    pedidosHoje = pedidos.filter(p => normalizar(itemValor(p,"Dia","dia")) === normalizar(dia) && pedidoConta(p));

    try {
      checkinsHoje = await window.SP.getCheckIn(semanaId, dia);
    } catch(e) {
      console.warn("CheckIn:", e);
      checkinsHoje = [];
    }

    renderLista();
  } catch(e) {
    console.error(e);
    lista.innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">Não foi possível conectar</div>
        <div class="empty-sub">${e.message || e}</div>
        <button class="connect" onclick="conectar()">Conectar novamente</button>
      </div>`;
  }
}

async function conectar(){
  try {
    await window.SP.login();
    await sincronizar();
  } catch(e) {
    alert("Não foi possível conectar: " + (e.message || e));
  }
}

function limparBusca(){
  document.getElementById("busca").value = "";
  renderLista();
}

function renderLista(){
  const lista = document.getElementById("lista");
  const termo = normalizar(document.getElementById("busca").value);
  const filtrados = pedidosHoje.filter(p => normalizar(getNome(p)).includes(termo));
  const entregues = pedidosHoje.filter(isCheckinFeito).length;

  document.getElementById("cntDone").textContent = `${entregues} entregues`;
  document.getElementById("cntTotal").textContent = `${pedidosHoje.length} total`;

  if (!pedidosHoje.length) {
    lista.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🍽️</div>
        <div class="empty-title">Nenhum pedido para hoje</div>
        <div class="empty-sub">Quando houver pedidos confirmados no admin, eles aparecerão aqui automaticamente.</div>
      </div>`;
    return;
  }

  if (!filtrados.length) {
    lista.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔎</div>
        <div class="empty-title">Nenhum colaborador encontrado</div>
      </div>`;
    return;
  }

  lista.innerHTML = filtrados.map(p => {
    const done = isCheckinFeito(p);
    const nome = getNome(p);
    const opcao = getOpcao(p);
    return `
      <article class="item ${done ? "done" : ""}" ${done ? "" : `onclick="abrirModal('${getPedidoId(p)}')"`}>
        <div class="avatar">${iniciais(nome)}</div>
        <div class="info">
          <div class="name">${nome}</div>
          <div class="desc">${opcao}</div>
        </div>
        <div class="badge">${done ? "Entregue" : "Pendente"}</div>
      </article>
    `;
  }).join("");
}

function abrirModal(id){
  pedidoSelecionado = pedidosHoje.find(p => getPedidoId(p) === String(id));
  if (!pedidoSelecionado) return;
  document.getElementById("modalNome").textContent = getNome(pedidoSelecionado);
  document.getElementById("modal").classList.add("open");
}

function fecharModal(){
  pedidoSelecionado = null;
  document.getElementById("modal").classList.remove("open");
}

async function confirmarRetirada(){
  if (!pedidoSelecionado) return;

  try {
    const semanaId = semanaIdAtual();
    const dia = diaAtual();
    const cid = getColaboradorId(pedidoSelecionado);
    const nome = getNome(pedidoSelecionado);

    if (window.SP.saveCheckIn) {
      await window.SP.saveCheckIn(semanaId, cid, nome, dia, window.SP.getUserName ? window.SP.getUserName() : "Cozinha");
    } else {
      await window.SP.registrarCheckIn(semanaId, cid, nome, dia, window.SP.getUserName ? window.SP.getUserName() : "Cozinha");
    }

    fecharModal();
    mostrarToast("Retirada confirmada");
    await sincronizar();
  } catch(e) {
    alert("Erro ao confirmar retirada: " + (e.message || e));
  }
}

function mostrarToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

function iniciarFundoTecnologico(){
  const canvas = document.getElementById("techCanvas");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");
  let w = 0;
  let h = 0;
  let dpr = 1;
  let particles = [];
  let rafId = null;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);

    const qtd = Math.max(46, Math.min(82, Math.floor(w / 22)));
    particles = Array.from({length:qtd}, (_,i)=>criarParticula(i));
  }

  function criarParticula(i){
    const tipo = i % 11 === 0 ? "red" : i % 5 === 0 ? "green" : "blue";
    return {
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - .5) * .34,
      vy: (Math.random() - .5) * .28,
      r: tipo === "red" ? 2.4 : tipo === "green" ? 2.7 : 2.1 + Math.random() * 1.4,
      tipo,
      fase: Math.random() * Math.PI * 2
    };
  }

  function cor(p, alpha){
    if (p.tipo === "red") return `rgba(192,40,28,${alpha})`;
    if (p.tipo === "green") return `rgba(34,200,121,${alpha})`;
    return `rgba(97,184,255,${alpha})`;
  }

  function desenharHexagonos(t){
    const estruturas = [
      {x:w*.18,y:h*.18,s:58,a:.16},
      {x:w*.82,y:h*.24,s:74,a:.12},
      {x:w*.62,y:h*.78,s:86,a:.10}
    ];

    estruturas.forEach((m,idx)=>{
      ctx.save();
      ctx.translate(m.x + Math.sin(t/1700+idx)*18, m.y + Math.cos(t/2100+idx)*14);
      ctx.rotate(Math.sin(t/3600+idx)*.18);
      ctx.strokeStyle = `rgba(97,184,255,${m.a})`;
      ctx.lineWidth = 1;

      ctx.beginPath();
      for(let i=0;i<6;i++){
        const ang = Math.PI/3*i + Math.PI/6;
        const x = Math.cos(ang)*m.s;
        const y = Math.sin(ang)*m.s;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.stroke();

      for(let i=0;i<6;i++){
        const ang = Math.PI/3*i + Math.PI/6;
        const x = Math.cos(ang)*m.s;
        const y = Math.sin(ang)*m.s;
        ctx.beginPath();
        ctx.arc(x,y,3.2,0,Math.PI*2);
        ctx.fillStyle = i%3===0 ? "rgba(34,200,121,.22)" : "rgba(97,184,255,.24)";
        ctx.fill();
      }
      ctx.restore();
    });
  }

  function loop(t){
    ctx.clearRect(0,0,w,h);

    desenharHexagonos(t);

    for(const p of particles){
      p.x += p.vx + Math.sin(t/1800 + p.fase) * .055;
      p.y += p.vy + Math.cos(t/2200 + p.fase) * .045;

      if(p.x < -20) p.x = w + 20;
      if(p.x > w + 20) p.x = -20;
      if(p.y < -20) p.y = h + 20;
      if(p.y > h + 20) p.y = -20;
    }

    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const a = particles[i], b = particles[j];
        const dx = a.x-b.x, dy = a.y-b.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        const max = 145;
        if(dist < max){
          const alpha = (1 - dist/max) * .22;
          ctx.beginPath();
          ctx.moveTo(a.x,a.y);
          ctx.lineTo(b.x,b.y);
          ctx.strokeStyle = `rgba(97,184,255,${alpha})`;
          ctx.lineWidth = .8;
          ctx.stroke();
        }
      }
    }

    for(const p of particles){
      const pulse = .65 + Math.sin(t/650 + p.fase) * .35;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r + pulse*.8,0,Math.PI*2);
      ctx.fillStyle = cor(p,.62);
      ctx.shadowColor = p.tipo === "green" ? "rgba(34,200,121,.75)" : p.tipo === "red" ? "rgba(192,40,28,.72)" : "rgba(97,184,255,.75)";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    rafId = requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  resize();
  rafId = requestAnimationFrame(loop);
}

iniciarFundoTecnologico();
atualizarData();

async function iniciarCozinha(){
  const lista = document.getElementById("lista");
  try {
    if (window.HOMY_SP_READY) {
      await window.HOMY_SP_READY;
    }
    if (!window.SP) {
      throw new Error("sharepoint.js não ficou disponível. Confirme se o arquivo sharepoint.js está na raiz do GitHub Pages.");
    }
    await sincronizar();
    setInterval(sincronizar, 30000);
  } catch(e) {
    console.error("Erro ao iniciar cozinha:", e);
    if (lista) {
      lista.innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          <div class="empty-title">Não foi possível conectar</div>
          <div class="empty-sub">${e.message || e}</div>
          <button class="connect" onclick="location.reload()">Recarregar</button>
        </div>`;
    }
  }
}

iniciarCozinha();
</script>
