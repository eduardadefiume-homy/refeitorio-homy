<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#040c1a">
<link rel="icon" type="image/png" href="favicon.png">
<title>Cozinha · Refeitório Homy</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#040c1a;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.065);
  --border:rgba(255,255,255,.085);--border2:rgba(255,255,255,.16);
  --text:#e8f0ff;--muted:rgba(143,170,210,.62);--blue:#1a64c8;--red:#c0281c;
  --green:#1a9e5c;--green-bg:rgba(26,158,92,.13);--green-bd:rgba(26,158,92,.32);
}
html,body{width:100%;min-height:100%;background:var(--bg);font-family:"Barlow",sans-serif;color:var(--text);overflow-x:hidden}
#tech-bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;opacity:.72}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(30,80,200,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(30,80,200,.045) 1px,transparent 1px);background-size:56px 56px}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 65% 45% at 50% 100%,rgba(20,60,160,.2),transparent 70%),radial-gradient(ellipse 50% 25% at 50% 0%,rgba(192,40,28,.08),transparent 70%)}
#root{position:relative;z-index:1;min-height:100vh;padding-bottom:2rem}
.header{position:sticky;top:0;z-index:20;background:rgba(4,12,26,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:1rem 1.2rem .95rem}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:.75rem}
.left-actions{display:flex;align-items:center;gap:.65rem;min-width:0}
.back-btn,.sync-pill{display:flex;align-items:center;gap:.4rem;border-radius:20px;padding:5px 11px;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap}
.back-btn{background:rgba(255,255,255,.055);border:1px solid var(--border);color:rgba(232,240,255,.8)}
.back-btn:hover{background:rgba(255,255,255,.09)}
.logo-row{display:flex;align-items:center;gap:.7rem;min-width:0}
.logo-row img{width:32px;height:32px;border-radius:50%;object-fit:contain;flex-shrink:0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);box-shadow:0 0 18px rgba(26,100,200,.22)}
.logo-label{font-family:"Barlow Condensed",sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;line-height:1}
.logo-sub{font-size:.65rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-top:.1rem}
.sync-pill{background:rgba(26,100,200,.12);border:1px solid rgba(26,100,200,.28);color:rgba(120,190,255,.9)}
.sync-pill:hover{background:rgba(26,100,200,.22)}
.sync-icon.spinning{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.date-bar{display:flex;align-items:baseline;gap:.65rem;flex-wrap:wrap}
.date-weekday{font-family:"Barlow Condensed",sans-serif;font-size:1.55rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.date-full{font-size:.76rem;font-weight:600;color:var(--muted);letter-spacing:.08em}
.cardapio-banner{margin:.9rem 1.2rem 0;padding:.85rem 1rem;background:rgba(26,100,200,.105);border:1px solid rgba(26,100,200,.25);border-radius:14px;display:flex;align-items:center;gap:.85rem;backdrop-filter:blur(10px)}
.cardapio-icon{font-size:1.35rem}
.cardapio-label{font-size:.63rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(120,190,255,.72);margin-bottom:.2rem}
.cardapio-items{font-size:.86rem;font-weight:600;color:var(--text);display:flex;flex-wrap:wrap;gap:.35rem .75rem}
.cardapio-item{display:flex;align-items:center;gap:.35rem}.cardapio-item::before{content:"·";color:var(--red);font-weight:800}.cardapio-item:first-child::before{display:none}
.search-row{padding:.9rem 1.2rem .15rem;display:grid;grid-template-columns:1fr auto;gap:.65rem;align-items:center}
.search-box{position:relative}
.search-box input{width:100%;height:42px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.045);color:var(--text);font-family:"Barlow",sans-serif;font-size:.86rem;padding:0 42px 0 38px;outline:none}
.search-box input:focus{border-color:rgba(80,160,255,.48);box-shadow:0 0 0 3px rgba(26,100,200,.15)}
.search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.55}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:8px;background:rgba(255,255,255,.06);color:var(--muted);cursor:pointer}
.counter-row{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.2rem .25rem}
.counter-title{font-family:"Barlow Condensed",sans-serif;font-size:.82rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.counter-nums{display:flex;align-items:center;gap:.5rem;font-size:.74rem;font-weight:700}
.cnt-done{color:#40d090;background:rgba(26,158,92,.12);border:1px solid rgba(26,158,92,.28);border-radius:6px;padding:2px 8px}.cnt-total{color:var(--muted)}.cnt-sep{color:var(--border2)}
.list{padding:.5rem 1.2rem 1rem;display:flex;flex-direction:column;gap:.58rem}
.colab-card{display:flex;align-items:center;gap:.9rem;padding:.88rem 1rem;background:var(--panel);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s,opacity .2s;position:relative;overflow:hidden;animation:card-in .35s ease both;backdrop-filter:blur(8px)}
.colab-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent)}
@keyframes card-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.colab-card:hover:not(.done){background:rgba(255,255,255,.075);border-color:var(--border2);transform:translateY(-1px)}
.colab-card.done{background:var(--green-bg);border-color:var(--green-bd);cursor:default;pointer-events:none}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:"Barlow Condensed",sans-serif;font-size:1rem;font-weight:800;background:rgba(26,100,200,.35);border:1px solid rgba(26,100,200,.32);color:rgba(150,210,255,.9)}
.colab-card.done .avatar{background:rgba(26,158,92,.2);border-color:rgba(26,158,92,.35);color:#40d090}
.colab-info{flex:1;min-width:0}.colab-name{font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.colab-opcao{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.12rem}
.colab-card.done .colab-name{color:rgba(64,208,144,.94)}.colab-card.done .colab-opcao{color:rgba(64,208,144,.58)}
.status-badge{flex-shrink:0;font-size:.58rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.badge-pending{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(143,170,210,.56)}.badge-done{background:rgba(26,158,92,.18);border:1px solid rgba(26,158,92,.3);color:#40d090}
.check-icon{font-size:1.1rem;opacity:0;transform:scale(.5);transition:opacity .25s,transform .25s;flex-shrink:0}.colab-card.done .check-icon{opacity:1;transform:scale(1)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3.5rem 2rem;color:var(--muted);text-align:center;gap:.6rem}.empty-icon{font-size:2.5rem;opacity:.35}.empty-title{font-size:.96rem;font-weight:700;color:rgba(143,170,210,.55)}.empty-sub{font-size:.78rem;max-width:280px;line-height:1.5}
.skeleton{height:62px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:14px;border:1px solid var(--border)}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
#modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(4,12,26,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:1.5rem;opacity:0;pointer-events:none;transition:opacity .2s}#modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:#0a1628;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:1.8rem 1.5rem;width:100%;max-width:340px;box-shadow:0 24px 60px rgba(0,0,0,.55);transform:scale(.92) translateY(10px);transition:transform .22s;text-align:center}#modal-overlay.open .modal{transform:scale(1) translateY(0)}
.modal-icon{font-size:2.2rem;margin-bottom:.8rem}.modal-title{font-family:"Barlow Condensed",sans-serif;font-size:1.2rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;margin-bottom:.4rem}.modal-sub{font-size:.84rem;color:var(--muted);line-height:1.5;margin-bottom:1.4rem}.modal-sub strong{color:var(--text);font-weight:700}
.modal-btns{display:flex;gap:.7rem}.btn{flex:1;padding:.72rem .5rem;border-radius:12px;border:none;cursor:pointer;font-family:"Barlow",sans-serif;font-size:.83rem;font-weight:700;letter-spacing:.04em}.btn:active{transform:scale(.97)}.btn-cancel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--muted)}.btn-confirm{background:linear-gradient(135deg,#1a9e5c,#15834d);border:1px solid rgba(26,158,92,.4);color:#fff;box-shadow:0 4px 16px rgba(26,158,92,.25)}
#toast{position:fixed;bottom:1.8rem;left:50%;transform:translateX(-50%) translateY(20px);z-index:200;background:#0d2010;border:1px solid rgba(26,158,92,.4);border-radius:12px;padding:.65rem 1.2rem;font-size:.8rem;font-weight:700;color:#40d090;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.4)}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{text-align:center;padding:0 1.2rem;font-size:.62rem;color:rgba(143,170,210,.34);letter-spacing:.1em;text-transform:uppercase}
@media(max-width:720px){.header-top{align-items:flex-start}.left-actions{flex-wrap:wrap}.sync-pill span:last-child{display:none}.search-row{grid-template-columns:1fr}.cardapio-banner{align-items:flex-start}.date-weekday{font-size:1.35rem}}
</style>
</head>
<body>
<canvas id="tech-bg"></canvas>

<div id="modal-overlay">
  <div class="modal">
    <div class="modal-icon">🍽️</div>
    <div class="modal-title">Confirmar retirada</div>
    <div class="modal-sub" id="modal-msg">Confirmar retirada?</div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-confirm" onclick="confirmarCheckin()">Confirmar ✓</button>
    </div>
  </div>
</div>

<div id="toast">✓ Retirada confirmada</div>

<div id="root">
  <div class="header">
    <div class="header-top">
      <div class="left-actions">
        <a class="back-btn" href="index.html">← Voltar</a>
        <div class="logo-row">
          <img src="favicon.png" alt="Homy">
          <div>
            <div class="logo-label">Cozinha</div>
            <div class="logo-sub">Homy Química</div>
          </div>
        </div>
      </div>
      <button class="sync-pill" onclick="sincronizar()" title="Atualizar lista">
        <span class="sync-icon" id="sync-icon">↻</span>
        <span id="sync-label">Atualizar</span>
      </button>
    </div>
    <div class="date-bar">
      <span class="date-weekday" id="date-weekday">—</span>
      <span class="date-full" id="date-full">—</span>
    </div>
  </div>

  <div class="cardapio-banner" id="cardapio-banner">
    <span class="cardapio-icon">🍱</span>
    <div>
      <div class="cardapio-label">Cardápio de hoje</div>
      <div class="cardapio-items" id="cardapio-items">Carregando cardápio...</div>
    </div>
  </div>

  <div class="search-row">
    <div class="search-box">
      <span class="search-ico">🔎</span>
      <input id="busca" type="search" placeholder="Pesquisar colaborador..." autocomplete="off">
      <button class="clear-btn" id="limparBusca" type="button">×</button>
    </div>
  </div>

  <div class="counter-row">
    <span class="counter-title">Lista do dia</span>
    <div class="counter-nums">
      <span class="cnt-done" id="cnt-done">0 entregues</span>
      <span class="cnt-sep">·</span>
      <span class="cnt-total" id="cnt-total">0 total</span>
    </div>
  </div>

  <div class="list" id="lista">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>

  <div class="footer" id="footer-sync">Atualiza automaticamente a cada 2 min</div>
</div>

<script>
const SP_CONFIG = {
  tenantId:     "a2850abc-334a-4805-b6b2-420b4aef68a9",
  clientId:     "aa37acf9-f3bd-4d1e-968a-fde57f79094c",
  clientSecret: "25e6e2a6-1201-4a48-bb21-0424244eb1ed",
  siteHostname: "homyquimica.sharepoint.com",
  sitePath:     "/sites/Refeitrio-Homy",
  lists: {
    pedidos:  ["Pedidos"],
    cardapio: ["Cardapio", "Cardápio"],
    checkin:  ["CheckIn", "Check-in", "Check In"]
  }
};
</script>

<script>
const DIAS_PT  = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
const DIAS_KEY = ["domingo","segunda","terca","quarta","quinta","sexta","sabado"];

let _token = null;
let _siteId = null;
let _listIds = {};
let _pedidos = [];
let _feitos = new Set();
let _pendente = null;
let _busca = "";

function normalizar(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();}
function escHTML(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function diaHojeKey(){return DIAS_KEY[new Date().getDay()];}
function dataHojeBR(){
  const d = new Date();
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
}

(function renderData(){
  const d = new Date();
  document.getElementById("date-weekday").textContent = DIAS_PT[d.getDay()];
  document.getElementById("date-full").textContent = dataHojeBR();
})();

async function getToken(){
  if(_token) return _token;
  const r = await fetch(`https://login.microsoftonline.com/${SP_CONFIG.tenantId}/oauth2/v2.0/token`,{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({
      grant_type:"client_credentials",
      client_id:SP_CONFIG.clientId,
      client_secret:SP_CONFIG.clientSecret,
      scope:"https://graph.microsoft.com/.default"
    })
  });
  if(!r.ok) throw new Error("Token HTTP " + r.status);
  const j = await r.json();
  _token = j.access_token;
  return _token;
}

async function graph(path, options={}){
  const token = await getToken();
  const r = await fetch("https://graph.microsoft.com/v1.0" + path,{
    ...options,
    headers:{Authorization:"Bearer "+token,"Content-Type":"application/json",...(options.headers||{})}
  });
  if(r.status === 401){_token=null;return graph(path,options);}
  if(!r.ok) throw new Error("Graph " + r.status + " " + path);
  if(r.status === 204) return null;
  return r.json();
}

async function getSiteId(){
  if(_siteId) return _siteId;
  const d = await graph(`/sites/${SP_CONFIG.siteHostname}:${SP_CONFIG.sitePath}`);
  _siteId = d.id;
  return _siteId;
}

async function getListId(candidates){
  const key = candidates.join("|");
  if(_listIds[key]) return _listIds[key];

  const siteId = await getSiteId();
  const all = await graph(`/sites/${siteId}/lists?$top=999`);
  const wanted = candidates.map(normalizar);

  const found = (all.value || []).find(l => wanted.includes(normalizar(l.displayName || l.name)));
  if(!found) throw new Error("Lista não encontrada: " + candidates.join(" / "));

  _listIds[key] = found.id;
  return found.id;
}

async function getListItems(candidates){
  const siteId = await getSiteId();
  const listId = await getListId(candidates);
  const data = await graph(`/sites/${siteId}/lists/${listId}/items?expand=fields&$top=999`);
  return (data.value || []).map(i => ({id:i.id, ...(i.fields||{})}));
}

async function createListItem(candidates, fields){
  const siteId = await getSiteId();
  const listId = await getListId(candidates);
  return graph(`/sites/${siteId}/lists/${listId}/items`,{
    method:"POST",
    body:JSON.stringify({fields})
  });
}

function itemDoDia(item){
  const dia = normalizar(item.Dia || item.dia || "");
  const hoje = diaHojeKey();
  const labelHoje = normalizar(DIAS_PT[new Date().getDay()]);
  return dia === hoje || dia === labelHoje || dia.includes(hoje) || labelHoje.includes(dia);
}

function pedidoConta(p){
  const status = normalizar(p.Status || "");
  return !["cancelado","bloqueado","afastado","ferias","férias","nao vai almocar","não vai almoçar"].includes(status);
}

async function buscarCardapio(){
  const el = document.getElementById("cardapio-items");
  try{
    const items = await getListItems(SP_CONFIG.lists.cardapio);
    const hoje = items.filter(itemDoDia);

    const opcoes = [];
    hoje.forEach(f=>{
      ["Principal","Light","Carne","Massa","Lanche","Nome_Prato","NomePrato","Prato","Descricao","Descrição","Detalhes"].forEach(c=>{
        if(f[c] && String(f[c]).trim()) opcoes.push(String(f[c]).trim());
      });
      if(f.Opcao && f.Nome_Prato) opcoes.push(`${f.Opcao}: ${f.Nome_Prato}`);
    });

    const unicas = [...new Set(opcoes)].filter(Boolean);

    el.innerHTML = unicas.length
      ? unicas.map(o=>`<span class="cardapio-item">${escHTML(o)}</span>`).join("")
      : `<span style="color:rgba(143,170,210,.55)">Cardápio ainda não cadastrado para hoje.</span>`;
  }catch(e){
    console.warn("Cardápio:", e.message);
    el.innerHTML = `<span style="color:rgba(143,170,210,.55)">Não foi possível carregar o cardápio.</span>`;
  }
}

async function buscarCheckIns(){
  try{
    const items = await getListItems(SP_CONFIG.lists.checkin);
    const hoje = diaHojeKey();
    _feitos = new Set(
      items.filter(i => normalizar(i.Dia || "") === hoje || String(i.Data || i.DataHora || "").startsWith(new Date().toISOString().slice(0,10)))
           .map(i => String(i.PedidoId || i.Title || ""))
           .filter(Boolean)
    );
  }catch(e){
    console.warn("CheckIn:", e.message);
    _feitos = new Set();
  }
}

async function buscarPedidos(){
  const items = await getListItems(SP_CONFIG.lists.pedidos);
  _pedidos = items
    .filter(itemDoDia)
    .filter(pedidoConta)
    .map(p => ({
      spItemId: String(p.id),
      nome: p.Colaborador_nome || p.NomeColaborador || p.Nome || p.Title || "Sem nome",
      opcao: p.Opcao || p.Nome_Prato || p.OpcaoEscolhida || p.Prato || "Principal",
      centro: p.Centro_Custo || ""
    }))
    .sort((a,b)=>a.nome.localeCompare(b.nome));

  await buscarCheckIns();
}

function renderLista(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  const filtrados = _pedidos.filter(p => normalizar(p.nome).includes(normalizar(_busca)));

  if(!filtrados.length){
    lista.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🍽️</div>
        <div class="empty-title">${_busca ? "Nenhum nome encontrado" : "Nenhum pedido para hoje"}</div>
        <div class="empty-sub">${_busca ? "Limpe a busca para ver a lista completa." : "Os pedidos aparecerão aqui assim que os colaboradores marcarem a refeição."}</div>
      </div>`;
    atualizarContador();
    return;
  }

  filtrados.forEach((p,idx)=>{
    const feito = _feitos.has(p.spItemId);
    const iniciais = p.nome.split(" ").slice(0,2).map(w=>w[0]||"").join("").toUpperCase();

    const card = document.createElement("div");
    card.className = "colab-card" + (feito ? " done" : "");
    card.style.animationDelay = (idx*.035)+"s";
    card.innerHTML = `
      <div class="avatar">${feito ? "✓" : escHTML(iniciais)}</div>
      <div class="colab-info">
        <div class="colab-name">${escHTML(p.nome)}</div>
        <div class="colab-opcao">${escHTML(p.opcao)}${p.centro ? " · " + escHTML(p.centro) : ""}</div>
      </div>
      <span class="status-badge ${feito ? "badge-done" : "badge-pending"}">${feito ? "Entregue" : "Pendente"}</span>
      <span class="check-icon">✓</span>
    `;
    if(!feito) card.onclick = () => abrirModal(p);
    lista.appendChild(card);
  });

  atualizarContador();
}

function atualizarContador(){
  const total = _pedidos.length;
  const feitos = _pedidos.filter(p=>_feitos.has(p.spItemId)).length;
  document.getElementById("cnt-done").textContent = `${feitos} entregue${feitos!==1?"s":""}`;
  document.getElementById("cnt-total").textContent = `${total} total`;
}

function abrirModal(pedido){
  _pendente = pedido;
  document.getElementById("modal-msg").innerHTML =
    `Confirmar retirada para <strong>${escHTML(pedido.nome)}</strong>?<br>
     <span style="font-size:.75rem;color:rgba(143,170,210,.55)">${escHTML(pedido.opcao)}</span>`;
  document.getElementById("modal-overlay").classList.add("open");
}

function fecharModal(){
  document.getElementById("modal-overlay").classList.remove("open");
  _pendente = null;
}

async function confirmarCheckin(){
  if(!_pendente) return;
  const p = _pendente;
  fecharModal();

  _feitos.add(p.spItemId);
  renderLista();
  mostrarToast("✓ " + p.nome + " — retirada confirmada");

  try{
    await createListItem(SP_CONFIG.lists.checkin,{
      Title: p.spItemId,
      PedidoId: p.spItemId,
      NomeColaborador: p.nome,
      OpcaoEscolhida: p.opcao,
      Dia: diaHojeKey(),
      DataHora: new Date().toISOString(),
      Confirmado: true
    });
  }catch(e){
    console.error("Erro ao registrar check-in:", e.message);
    mostrarToast("Retirada marcada na tela. Falha ao salvar no SharePoint.");
  }
}

function mostrarToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2800);
}

async function sincronizar(){
  const icon = document.getElementById("sync-icon");
  const label = document.getElementById("sync-label");
  icon.classList.add("spinning");
  label.textContent = "Atualizando…";

  try{
    await Promise.all([buscarCardapio(), buscarPedidos()]);
    renderLista();

    const agora = new Date();
    const hora = `${String(agora.getHours()).padStart(2,"0")}:${String(agora.getMinutes()).padStart(2,"0")}`;
    label.textContent = hora;
    document.getElementById("footer-sync").textContent = "Última atualização às " + hora + " · Atualiza a cada 2 min";
  }catch(e){
    console.error("Erro ao sincronizar:", e);
    label.textContent = "Erro";
    document.getElementById("lista").innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">Erro ao carregar dados</div>
        <div class="empty-sub">${escHTML(e.message || e)}</div>
      </div>`;
  }finally{
    icon.classList.remove("spinning");
  }
}

document.getElementById("busca").addEventListener("input", e => {
  _busca = e.target.value || "";
  renderLista();
});
document.getElementById("limparBusca").addEventListener("click", () => {
  document.getElementById("busca").value = "";
  _busca = "";
  renderLista();
});

(function techBackground(){
  const canvas = document.getElementById("tech-bg");
  const ctx = canvas.getContext("2d");
  let W,H,nodes=[];

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    nodes = Array.from({length:Math.min(44,Math.max(22,Math.floor(W/38)))},()=>({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,
      r:1.8+Math.random()*2.4,type:Math.random()
    }));
  }

  function drawHex(x,y,r,a){
    ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.beginPath();
    for(let i=0;i<6;i++){const ang=Math.PI/3*i;const px=Math.cos(ang)*r,py=Math.sin(ang)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
    ctx.closePath();ctx.strokeStyle="rgba(80,180,255,.075)";ctx.lineWidth=1;ctx.stroke();ctx.restore();
  }

  function frame(t){
    ctx.clearRect(0,0,W,H);

    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      a.x+=a.vx;a.y+=a.vy;
      if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1;

      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);
        if(dist<145){
          const alpha=(1-dist/145)*.16;
          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
          ctx.strokeStyle=`rgba(90,170,255,${alpha})`;ctx.lineWidth=.75;ctx.stroke();
        }
      }
    }

    nodes.forEach(n=>{
      const color = n.type>.82 ? "192,40,28" : n.type>.62 ? "64,208,144" : "100,190,255";
      ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${color},.34)`;ctx.fill();
      ctx.shadowBlur=16;ctx.shadowColor=`rgba(${color},.22)`;ctx.fill();ctx.shadowBlur=0;
    });

    for(let i=0;i<7;i++) drawHex((i*260 + (t*.018)%260)-80, 110+(i%3)*170, 34+(i%2)*13, t*.00012*(i+1));

    requestAnimationFrame(frame);
  }

  resize();window.addEventListener("resize",resize);requestAnimationFrame(frame);
})();

sincronizar();
setInterval(sincronizar, 2*60*1000);
</script>
