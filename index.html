<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#040c1a;overflow:hidden;font-family:"Barlow",sans-serif;color:#e8f0ff}

#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#040c1a;transition:opacity 1s ease}
#splash.hide{opacity:0;pointer-events:none}

#bg-canvas,#ring-canvas,#particle-canvas{position:absolute;inset:0;width:100%;height:100%}
#bg-canvas{z-index:0}
#ring-canvas{z-index:1}
#particle-canvas{z-index:2;pointer-events:none}

.splash-center{
  position:relative;z-index:3;
  display:flex;flex-direction:column;align-items:center;
  gap:0;
  margin-bottom:20vh;
}

.logo-circle{width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,rgba(40,80,200,0.3) 0%,rgba(20,50,140,0.18) 55%,transparent 100%);
  border:1.5px solid rgba(60,140,255,0.25);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  box-shadow:0 0 50px rgba(40,100,255,0.16),0 0 100px rgba(20,60,200,0.07),inset 0 1px 0 rgba(255,255,255,0.06);
  opacity:0;
  animation:circle-in 1.2s cubic-bezier(.22,1,.36,1) 2.3s forwards;
}
.logo-circle.visible{
  opacity:1;
  animation:logo-float 3.8s ease-in-out infinite !important;
}
@keyframes circle-in{
  0%  {opacity:0;transform:scale(0.5) translateY(20px)}
  65% {opacity:1;transform:scale(1.06) translateY(-6px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
@keyframes logo-float{
  0%,100%{transform:translateY(0)}
  50%    {transform:translateY(-22px)}
}

.logo-circle::before{
  content:"";position:absolute;inset:-10px;border-radius:50%;
  border:1.5px solid transparent;
  border-top-color:rgba(60,160,255,0.75);
  border-right-color:rgba(60,160,255,0.15);
  animation:spin 4s linear infinite;
}
.logo-circle::after{
  content:"";position:absolute;inset:-20px;border-radius:50%;
  border:1px solid transparent;
  border-bottom-color:rgba(192,40,28,0.55);
  border-left-color:rgba(192,40,28,0.12);
  animation:spin 7s linear infinite reverse;
}
@keyframes spin{to{transform:rotate(360deg)}}

.logo-circle img{width:72px;height:72px;object-fit:contain;
  filter:drop-shadow(0 4px 22px rgba(26,80,220,0.6)) drop-shadow(0 0 40px rgba(192,40,28,0.3));
}

.logo-shadow-el{
  width:130px;height:13px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(40,100,255,0.38) 0%,transparent 70%);
  margin-top:8px;
  opacity:0;
  animation:shadow-in 0.6s ease-out 3.1s forwards;
}
.logo-shadow-el.visible{
  opacity:1;
  animation:shadow-float 3.8s ease-in-out infinite !important;
}
@keyframes shadow-in{to{opacity:1}}
@keyframes shadow-float{
  0%,100%{transform:scaleX(1);opacity:0.46}
  50%    {transform:scaleX(0.55);opacity:0.16}
}

.splash-title-block{
  display:flex;flex-direction:column;align-items:center;
  margin-top:1.6rem;
  opacity:0;
  animation:fade-up 0.9s ease-out 3.5s forwards;
}
.splash-title-block.visible{opacity:1 !important;animation:none !important}

@keyframes fade-up{
  from{opacity:0;transform:translateY(10px)}
  to  {opacity:1;transform:translateY(0)}
}
.splash-title{
  font-family:"Barlow Condensed",sans-serif;
  font-size:2.1rem;font-weight:700;letter-spacing:0.09em;
  text-transform:uppercase;color:#fff;line-height:1;
}
.splash-line{width:44px;height:2px;background:#c0281c;border-radius:1px;margin:0.45rem auto}
.splash-sub{
  font-size:0.72rem;font-weight:400;letter-spacing:0.22em;
  text-transform:uppercase;color:rgba(143,170,210,0.65);
}

/* ===== MAIN APP ===== */
#app{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:space-between;opacity:0;pointer-events:none;transition:opacity 0.9s ease 0.2s}
#app.show{opacity:1;pointer-events:all}
#app-bg-canvas{position:fixed;inset:0;z-index:0;width:100%;height:100%}

.app-header{width:100%;display:flex;flex-direction:column;align-items:center;padding:2rem 1.5rem 0.8rem;position:relative;z-index:1}
.app-logo-mini{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;margin-bottom:0.75rem;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.app-logo-mini img{width:44px;height:44px;object-fit:contain}
.app-title{font-family:"Barlow Condensed",sans-serif;font-size:1.65rem;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#fff;line-height:1}
.app-subtitle{font-size:0.7rem;font-weight:400;color:rgba(143,170,210,0.65);letter-spacing:0.2em;text-transform:uppercase;margin-top:0.2rem}
.app-divider{width:38px;height:2px;background:#c0281c;border-radius:1px;margin:0.75rem auto 0}

.menu-grid{width:100%;max-width:440px;padding:0 1.2rem;display:flex;flex-direction:column;gap:0.72rem;position:relative;z-index:1}
.menu-card{display:flex;align-items:center;gap:1rem;padding:0.95rem 1.1rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);border-radius:16px;cursor:pointer;text-decoration:none;color:inherit;transition:background .18s,border-color .18s,transform .12s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 14px rgba(0,0,0,0.25),inset 0 1px 0 rgba(255,255,255,0.05);position:relative;overflow:hidden}
.menu-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent)}
.menu-card:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.16);transform:translateY(-2px) scale(1.01)}
.menu-card:active{transform:scale(0.98)}
.menu-card.disabled{opacity:0.35;pointer-events:none;filter:grayscale(0.6) brightness(0.65)}
.card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.3rem}
.icon-blue{background:rgba(26,58,110,0.55);border:1px solid rgba(26,100,200,0.3)}
.icon-red{background:rgba(192,40,28,0.28);border:1px solid rgba(192,40,28,0.28)}
.icon-teal{background:rgba(16,110,90,0.35);border:1px solid rgba(16,160,120,0.3)}
.card-info{flex:1;min-width:0}
.card-title{font-size:0.93rem;font-weight:600;color:#fff;margin-bottom:0.14rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-desc{font-size:0.74rem;font-weight:400;color:rgba(143,170,210,0.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-badge{font-size:0.61rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:3px 7px;border-radius:5px;flex-shrink:0}
.badge-locked{background:rgba(192,40,28,0.14);color:#c07060;border:1px solid rgba(192,40,28,0.22)}
.badge-live{background:rgba(16,160,100,0.18);color:#40d090;border:1px solid rgba(16,160,100,0.28)}
.badge-loading{background:rgba(60,100,180,0.14);color:rgba(143,170,210,0.7);border:1px solid rgba(60,100,180,0.22)}
.card-arrow{color:rgba(255,255,255,0.2);font-size:1rem;flex-shrink:0;margin-left:2px}

.app-footer{width:100%;display:flex;flex-direction:column;align-items:center;padding:0.8rem 1.5rem 1.8rem;position:relative;z-index:1;gap:0.4rem}
.footer-day{font-size:0.67rem;color:rgba(143,170,210,0.48);letter-spacing:0.12em;text-transform:uppercase}
.footer-dots{display:flex;gap:5px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.1)}
.dot.active{background:#c0281c;width:16px;border-radius:3px}
.badge-open{background:rgba(34,200,121,.16)!important;color:#40d090!important;border:1px solid rgba(34,200,121,.28)!important}
</style>
</head>

     CONFIGURAÇÃO — preencha após criar o clientSecret no Azure AD
     ===================================================================== -->
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  CONFIGURAÇÕES DO AZURE AD  (leitura somente — sem popup de login)
// ─────────────────────────────────────────────────────────────────────────────
const SP_CONFIG = {
  tenantId:    "a2850abc-334a-4805-b6b2-420b4aef68a9",
  clientId:    "aa37acf9-f3bd-4d1e-968a-fde57f79094c",
  clientSecret: "25e6e2a6-1201-4a48-bb21-0424244eb1ed",          // ← substitua após criar
  siteHostname: "homyquimica.sharepoint.com",
  sitePath:     "/sites/Refeitrio-Homy",              // atenção ao nome do site
  listName:     "Configurações"
};
// ─────────────────────────────────────────────────────────────────────────────
</script>

<script>
// ── data no rodapé ────────────────────────────────────────────────────────────
(function(){
  const d    = new Date();
  const dias  = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
  const meses = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  document.getElementById("footer-date").textContent =
    dias[d.getDay()] + ", " + d.getDate() + " de " + meses[d.getMonth()];
})();

// ── canvas / animações (idêntico ao original) ─────────────────────────────────
const bgC = document.getElementById("bg-canvas"),  bgX = bgC.getContext("2d");
const rC  = document.getElementById("ring-canvas"), rX  = rC.getContext("2d");
const pC  = document.getElementById("particle-canvas"), pX = pC.getContext("2d");

function resize(){
  bgC.width = rC.width = pC.width  = window.innerWidth;
  bgC.height= rC.height= pC.height = window.innerHeight;
  drawBg();
}
function drawBg(){
  const W=bgC.width, H=bgC.height;
  bgX.fillStyle="#040c1a"; bgX.fillRect(0,0,W,H);
  bgX.strokeStyle="rgba(30,80,200,0.052)"; bgX.lineWidth=0.5;
  for(let x=0;x<W;x+=56){bgX.beginPath();bgX.moveTo(x,0);bgX.lineTo(x,H);bgX.stroke();}
  for(let y=0;y<H;y+=56){bgX.beginPath();bgX.moveTo(0,y);bgX.lineTo(W,y);bgX.stroke();}
  const g=bgX.createRadialGradient(W/2,H*0.8,0,W/2,H*0.8,W*0.55);
  g.addColorStop(0,"rgba(20,60,160,0.22)"); g.addColorStop(1,"transparent");
  bgX.fillStyle=g; bgX.fillRect(0,0,W,H);
  const gr=bgX.createRadialGradient(W/2,0,0,W/2,0,W*0.4);
  gr.addColorStop(0,"rgba(192,40,28,0.1)"); gr.addColorStop(1,"transparent");
  bgX.fillStyle=gr; bgX.fillRect(0,0,W,H);
}
resize(); window.addEventListener("resize",resize);

const RINGS=[
  {rx:300,ry:32,a:0.32,lw:1.8,spd:0.008,ph:0},
  {rx:230,ry:25,a:0.26,lw:1.3,spd:0.012,ph:1.0},
  {rx:170,ry:18,a:0.23,lw:1.0,spd:0.016,ph:2.0},
  {rx:120,ry:13,a:0.2, lw:0.8,spd:0.021,ph:0.4},
  {rx:80, ry:9, a:0.18,lw:0.6,spd:0.027,ph:1.7},
  {rx:46, ry:5, a:0.16,lw:0.45,spd:0.034,ph:2.9},
  {rx:360,ry:38,a:0.14,lw:0.7,spd:0.005,ph:0.6},
  {rx:420,ry:45,a:0.08,lw:0.45,spd:0.003,ph:1.3},
];
function drawRings(t){
  rX.clearRect(0,0,rC.width,rC.height);
  const cx=rC.width/2, cy=rC.height*0.85;
  RINGS.forEach((rd,i)=>{
    const pulse=0.5+0.5*Math.abs(Math.sin(t*rd.spd*55+rd.ph));
    rX.beginPath(); rX.ellipse(cx,cy,rd.rx,rd.ry,0,0,Math.PI*2);
    rX.strokeStyle="rgba(40,150,255,"+(rd.a*pulse)+")";
    rX.lineWidth=rd.lw; rX.stroke();
    if(i<5){
      const as=t*rd.spd*55+rd.ph, al=Math.PI*0.38;
      rX.save(); rX.translate(cx,cy); rX.scale(1,rd.ry/rd.rx);
      rX.beginPath(); rX.arc(0,0,rd.rx,as,as+al);
      const g=rX.createLinearGradient(Math.cos(as)*rd.rx,Math.sin(as)*rd.rx,Math.cos(as+al)*rd.rx,Math.sin(as+al)*rd.rx);
      g.addColorStop(0,"rgba(80,200,255,0)");
      g.addColorStop(0.5,"rgba(140,230,255,"+(pulse*0.95)+")");
      g.addColorStop(1,"rgba(80,200,255,0)");
      rX.strokeStyle=g; rX.lineWidth=rd.lw*2.8; rX.stroke(); rX.restore();
    }
  });
  const cg=rX.createRadialGradient(cx,cy,0,cx,cy,85);
  cg.addColorStop(0,"rgba(40,120,255,0.13)"); cg.addColorStop(1,"transparent");
  rX.fillStyle=cg; rX.beginPath(); rX.ellipse(cx,cy,85,13,0,0,Math.PI*2); rX.fill();
  rX.beginPath(); rX.arc(cx,cy,2.5,0,Math.PI*2);
  rX.fillStyle="rgba(100,210,255,0.9)"; rX.fill();
}

const nodes=[];
for(let i=0;i<30;i++){
  const a=Math.random()*Math.PI*2, r=15+Math.random()*115;
  nodes.push({x:Math.cos(a)*r, y:Math.sin(a)*r*0.55,
              vx:(Math.random()-.5)*.38, vy:(Math.random()-.5)*.28,
              r:1+Math.random()*1.8, alpha:0, target:0.5+Math.random()*0.5});
}

let t0=null, pDone=false, logoActivated=false, splashOut=false;
const SPLASH_DUR=9000;

function frame(ts){
  if(!t0) t0=ts;
  const el=ts-t0;
  const prog=Math.min(el/2500,1);
  const fade=el>2000?Math.max(0,1-(el-2000)/500):1;

  drawRings(ts/1000);
  pX.clearRect(0,0,pC.width,pC.height);

  if(!pDone){
    const cx=pC.width/2, cy=pC.height*0.33;
    nodes.forEach((n,i)=>{
      n.alpha=Math.min(n.target,Math.max(0,prog*30-i))*fade;
      n.x+=n.vx; n.y+=n.vy;
    });
    pX.lineWidth=0.7;
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<92){
        const a=(1-d/92)*Math.min(nodes[i].alpha,nodes[j].alpha)*0.65;
        pX.strokeStyle="rgba(80,170,255,"+a+")";
        pX.beginPath(); pX.moveTo(cx+nodes[i].x,cy+nodes[i].y);
        pX.lineTo(cx+nodes[j].x,cy+nodes[j].y); pX.stroke();
      }
    }
    nodes.forEach(n=>{
      if(n.alpha<=0) return;
      pX.beginPath(); pX.arc(pC.width/2+n.x,pC.height*0.33+n.y,n.r,0,Math.PI*2);
      pX.fillStyle="rgba(130,210,255,"+n.alpha+")"; pX.fill();
    });

    if(fade<=0 && !logoActivated){
      logoActivated=true;
      document.getElementById("logoCircle").classList.add("visible");
      document.getElementById("logoShadow").classList.add("visible");
      document.getElementById("titleBlock").classList.add("visible");
      pDone=true;
    }
  }

  if(!splashOut && el>SPLASH_DUR){
    splashOut=true;
    document.getElementById("splash").classList.add("hide");
    setTimeout(()=>{ document.getElementById("app").classList.add("show"); }, 300);

    const ac=document.getElementById("app-bg-canvas");
    ac.width=window.innerWidth; ac.height=window.innerHeight;
    const ax=ac.getContext("2d");
    ax.fillStyle="#040c1a"; ax.fillRect(0,0,ac.width,ac.height);
    ax.strokeStyle="rgba(30,80,200,0.052)"; ax.lineWidth=0.5;
    for(let x=0;x<ac.width;x+=56){ax.beginPath();ax.moveTo(x,0);ax.lineTo(x,ac.height);ax.stroke();}
    for(let y=0;y<ac.height;y+=56){ax.beginPath();ax.moveTo(0,y);ax.lineTo(ac.width,y);ax.stroke();}
    const g=ax.createRadialGradient(ac.width/2,ac.height*.5,0,ac.width/2,ac.height*.5,ac.width*.5);
    g.addColorStop(0,"rgba(20,50,140,0.16)"); g.addColorStop(1,"transparent");
    ax.fillStyle=g; ax.fillRect(0,0,ac.width,ac.height);

    // ── verificar liberação após o app aparecer ──────────────────────────────
    setTimeout(verificarLiberacao, 400);
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── verificar liberação via App Token (sem login do usuário) ──────────────────
async function verificarLiberacao(){
  const btn = document.getElementById("btn-marcar");
  const badge = document.getElementById("badge-marcar");
  if(btn){ btn.classList.remove("disabled"); btn.removeAttribute("aria-disabled"); btn.setAttribute("href","marcar-refeicao.html"); }
  if(badge){ badge.textContent="ABRIR"; badge.className="card-badge badge-open"; }
}

function _setEstado(btn, badge, liberado){
  if(liberado){
    btn.classList.remove("disabled");
    badge.textContent = "Disponível";
    badge.className   = "card-badge badge-live";
    btn.removeAttribute("aria-disabled");
  } else {
    btn.classList.add("disabled");
    badge.textContent = "Indisponível";
    badge.className   = "card-badge badge-locked";
    btn.setAttribute("aria-disabled","true");
  }
}


</script>
</body>
