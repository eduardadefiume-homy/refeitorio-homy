<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#040c1a">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon.png">
<title>Refeitório · Homy Química</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;font-family:"Barlow",sans-serif;background:#040c1a;color:#e8f0ff;overflow-x:hidden}

body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 42% at 18% 8%,rgba(35,98,210,.20),transparent 60%),
    radial-gradient(ellipse 62% 40% at 88% 88%,rgba(24,190,125,.12),transparent 64%),
    radial-gradient(ellipse 50% 34% at 50% 105%,rgba(192,40,28,.10),transparent 70%),
    linear-gradient(180deg,#040c1a 0%,#041126 58%,#030912 100%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(72,138,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(72,138,255,.045) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,.25));
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,.25));
}

/* BG animado */
.tech-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#techCanvas{position:absolute;inset:0;width:100%;height:100%;opacity:.7}
.scan-line{position:absolute;left:-20%;right:-20%;top:-12%;height:160px;background:linear-gradient(180deg,transparent,rgba(80,170,255,.055),rgba(34,200,121,.03),transparent);transform:rotate(-7deg);animation:scanMove 11s ease-in-out infinite;}
@keyframes scanMove{0%{top:-20%;opacity:0}16%{opacity:1}70%{opacity:.75}100%{top:108%;opacity:0}}
.chem-symbol{position:absolute;width:150px;height:132px;opacity:.10;filter:drop-shadow(0 0 22px rgba(80,170,255,.2));animation:chemFloat 12s ease-in-out infinite alternate;}
.chem-symbol.s1{left:6%;top:12%;animation-duration:15s}
.chem-symbol.s2{right:6%;top:18%;animation-duration:18s;transform:scale(.8) rotate(18deg)}
.chem-symbol::before{content:"";position:absolute;inset:18px;border:1px solid rgba(122,190,255,.45);clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%);}
.chem-symbol::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:rgba(34,200,121,.7);box-shadow:-44px -38px 0 rgba(97,184,255,.7),44px -38px 0 rgba(97,184,255,.65),60px 0 0 rgba(192,40,28,.62),44px 38px 0 rgba(97,184,255,.68),-44px 38px 0 rgba(97,184,255,.68),-60px 0 0 rgba(34,200,121,.6);}
@keyframes chemFloat{0%{translate:0 0;opacity:.07}50%{translate:12px -16px;opacity:.14}100%{translate:-8px 10px;opacity:.09}}

/* LAYOUT */
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem}

/* LOGO */
.logo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:2rem}
.logo-ring{
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,rgba(40,80,200,.28) 0%,rgba(20,50,140,.18) 55%,transparent 100%);
  border:1.5px solid rgba(60,140,255,.25);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  box-shadow:0 0 40px rgba(40,100,255,.12);
  animation:logoFloat 3.6s ease-in-out infinite;
}
.logo-ring::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:1.5px solid transparent;border-top-color:rgba(60,160,255,.6);animation:spin 4s linear infinite}
.logo-ring::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:1px solid transparent;border-bottom-color:rgba(192,40,28,.5);animation:spin 7s linear infinite reverse}
.logo-ring img{width:90px;height:90px;object-fit:contain;image-rendering:auto}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}

.logo-title{font-family:"Barlow Condensed",sans-serif;font-size:2.2rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;margin-top:1.2rem;text-align:center}
.logo-line{width:44px;height:2px;background:#c0281c;border-radius:1px;margin:.4rem auto}
.logo-sub{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(143,170,210,.55);text-align:center}

/* DATA */
.data-hoje{font-size:.78rem;color:rgba(143,170,210,.5);letter-spacing:.08em;text-align:center;margin-bottom:1.8rem}

/* CARDS */
.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.85rem;width:100%;max-width:520px}
@media(max-width:380px){.menu-grid{grid-template-columns:1fr}}
@media(min-width:700px){.menu-grid{grid-template-columns:repeat(2,1fr);max-width:620px}}

.menu-card{
  display:flex;align-items:center;gap:.85rem;
  padding:1rem 1.1rem;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  text-decoration:none;color:#e8f0ff;
  transition:all .18s;
  cursor:pointer;
  position:relative;overflow:hidden;
}
.menu-card:hover{background:rgba(26,58,110,.3);border-color:rgba(60,140,255,.3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.menu-card:active{transform:scale(.98)}
.menu-card.disabled{opacity:.5;pointer-events:none}
.menu-card.locked{border-color:rgba(192,40,28,.3);background:rgba(192,40,28,.06)}

.card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex-shrink:0}
.icon-blue{background:rgba(26,58,110,.6);border:1px solid rgba(60,140,255,.25)}
.icon-green{background:rgba(16,100,80,.6);border:1px solid rgba(16,150,100,.25)}
.icon-red{background:rgba(192,40,28,.35);border:1px solid rgba(192,40,28,.25)}
.icon-purple{background:rgba(80,20,140,.5);border:1px solid rgba(140,80,220,.25)}
.icon-gold{background:rgba(140,90,0,.5);border:1px solid rgba(200,150,0,.25)}

.card-info{flex:1;min-width:0}
.card-title{font-weight:600;font-size:.95rem;color:#fff;line-height:1.3}
.card-desc{font-size:.7rem;color:rgba(143,170,210,.55);margin-top:2px;line-height:1.4}

.card-badge{font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;flex-shrink:0}
.badge-open{background:rgba(64,208,144,.15);color:#40d090;border:1px solid rgba(64,208,144,.25)}
.badge-closed{background:rgba(192,40,28,.15);color:rgba(255,120,100,.85);border:1px solid rgba(192,40,28,.25)}
.badge-loading{background:rgba(255,255,255,.06);color:rgba(143,170,210,.55);border:1px solid rgba(255,255,255,.08)}

.card-arrow{font-size:1.2rem;color:rgba(143,170,210,.35);flex-shrink:0}

/* FOOTER */
.app-footer{margin-top:2rem;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.footer-dots{display:flex;gap:.4rem}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.12);transition:background .3s}
.dot.active{background:rgba(192,40,28,.6)}
</style>
</head>
<body>

<div class="tech-bg" aria-hidden="true">
  <canvas id="techCanvas"></canvas>
  <div class="scan-line"></div>
  <div class="chem-symbol s1"></div>
  <div class="chem-symbol s2"></div>
</div>

<div class="app">

  <div class="logo-wrap">
    <div class="logo-ring">
      <img src="favicon.png" alt="Homy Química">
    </div>
    <div class="logo-title">Refeitório</div>
    <div class="logo-line"></div>
    <div class="logo-sub">Homy Química</div>
  </div>

  <div class="data-hoje" id="dataHoje"></div>

  <nav class="menu-grid">

    <a class="menu-card" href="cardapio-semana.html">
      <div class="card-icon icon-blue">📅</div>
      <div class="card-info">
        <div class="card-title">Cardápio da semana</div>
        <div class="card-desc">Segunda à sexta, cardápio completo</div>
      </div>
      <span class="card-arrow">›</span>
    </a>

    <a class="menu-card" id="btn-marcar" href="marcar-refeicao.html">
      <div class="card-icon icon-red">✏️</div>
      <div class="card-info">
        <div class="card-title">Marcar refeição</div>
        <div class="card-desc" id="desc-marcar">Verificando disponibilidade...</div>
      </div>
      <span class="card-badge badge-loading" id="badge-marcar">...</span>
      <span class="card-arrow">›</span>
    </a>

    <a class="menu-card" href="cardapio-dia.html">
      <div class="card-icon icon-green">🍽️</div>
      <div class="card-info">
        <div class="card-title">Cardápio de hoje</div>
        <div class="card-desc">Veja o que tem hoje no refeitório</div>
      </div>
      <span class="card-arrow">›</span>
    </a>

    <a class="menu-card" href="cozinha.html">
      <div class="card-icon icon-purple">👩‍🍳</div>
      <div class="card-info">
        <div class="card-title">Cozinha</div>
        <div class="card-desc">Lista do dia e confirmação de retirada</div>
      </div>
      <span class="card-arrow">›</span>
    </a>

  </nav>

  <div class="app-footer">
    <div class="footer-dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

</div>

<script>
// ── Data no topo ─────────────────────────────────────────────────────────────
(function(){
  const d    = new Date();
  const dias  = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
  const meses = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const el    = document.getElementById("dataHoje");
  if (el) el.textContent = dias[d.getDay()] + ", " + d.getDate() + " de " + meses[d.getMonth()] + " de " + d.getFullYear();
})();
</script>

<script>
// ── Status da marcação (sem login — leitura pública via SP anônimo não existe)
// Usa sharepoint.js apenas para verificar config — sem popup
(function(){
  function loadScript(src, cb){
    var s = document.createElement("script");
    s.src = src; s.onload = cb; s.onerror = cb;
    document.head.appendChild(s);
  }

  function atualizarBotaoMarcar(liberado, prazoISO){
    var btn    = document.getElementById("btn-marcar");
    var badge  = document.getElementById("badge-marcar");
    var desc   = document.getElementById("desc-marcar");
    if (!btn || !badge) return;

    // Verifica prazo
    var prazoVencido = false;
    if (prazoISO) {
      var dt = new Date(prazoISO);
      if (!isNaN(dt) && new Date() > dt) prazoVencido = true;
    }

    var aberto = liberado && !prazoVencido;

    if (aberto) {
      badge.textContent = "ABERTO";
      badge.className   = "card-badge badge-open";
      btn.classList.remove("locked","disabled");
      if (desc) {
        if (prazoISO) {
          var dt2  = new Date(prazoISO);
          var dias = ["dom","seg","ter","qua","qui","sex","sáb"];
          var hora = String(dt2.getHours()).padStart(2,"0") + "h" + (dt2.getMinutes()>0?String(dt2.getMinutes()).padStart(2,"0"):"");
          desc.textContent = "Prazo: " + dias[dt2.getDay()] + " às " + hora;
        } else {
          desc.textContent = "Marcação liberada";
        }
      }
    } else {
      badge.textContent = prazoVencido ? "ENCERRADO" : "FECHADO";
      badge.className   = "card-badge badge-closed";
      btn.classList.add("locked","disabled");
      if (desc) desc.textContent = prazoVencido ? "Prazo encerrado" : "Marcação bloqueada";
    }
  }

  // Tenta carregar sharepoint.js para verificar status de marcação
  loadScript("https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js", function(){
    loadScript("sharepoint.js", async function(){
      try {
        if (!window.SP) return;
        // Só init silencioso — sem popup
        var logado = await SP.init();
        if (!logado) {
          // Sem sessão: mantém badge neutro mas não bloqueia
          var badge = document.getElementById("badge-marcar");
          var desc  = document.getElementById("desc-marcar");
          if (badge) { badge.textContent = "ABRIR"; badge.className = "card-badge badge-open"; }
          if (desc)  desc.textContent = "Toque para marcar";
          return;
        }
        var [liberado, prazo] = await Promise.all([
          SP.isCardapioLiberado().catch(function(){ return true; }),
          SP.getPrazoMarcacao().catch(function(){ return null; })
        ]);
        atualizarBotaoMarcar(liberado, prazo);
      } catch(e) {
        // Em caso de erro: mostra como aberto para não bloquear
        var badge = document.getElementById("badge-marcar");
        if (badge) { badge.textContent = "ABRIR"; badge.className = "card-badge badge-open"; }
        var desc = document.getElementById("desc-marcar");
        if (desc) desc.textContent = "Toque para marcar";
      }
    });
  });
})();
</script>

<script>
// ── Fundo animado ─────────────────────────────────────────────────────────────
(function(){
  var canvas = document.getElementById("techCanvas");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var w=0, h=0, dpr=1, particles=[];

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1,2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width  = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
    canvas.style.width = w+"px"; canvas.style.height = h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var n = Math.max(36, Math.min(64, Math.floor(w/24)));
    particles = Array.from({length:n}, function(_,i){
      var tipo = i%11===0?"red":i%5===0?"green":"blue";
      return {x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.25, r:2+Math.random()*1.2, tipo:tipo, fase:Math.random()*Math.PI*2};
    });
  }

  function cor(p,a){
    if(p.tipo==="red")   return "rgba(192,40,28,"+a+")";
    if(p.tipo==="green") return "rgba(34,200,121,"+a+")";
    return "rgba(97,184,255,"+a+")";
  }

  function loop(t){
    ctx.clearRect(0,0,w,h);
    particles.forEach(function(p){
      p.x += p.vx + Math.sin(t/1800+p.fase)*.05;
      p.y += p.vy + Math.cos(t/2200+p.fase)*.04;
      if(p.x<-20)p.x=w+20; if(p.x>w+20)p.x=-20;
      if(p.y<-20)p.y=h+20; if(p.y>h+20)p.y=-20;
    });
    for(var i=0;i<particles.length;i++){
      for(var j=i+1;j<particles.length;j++){
        var a=particles[i],b=particles[j];
        var dx=a.x-b.x,dy=a.y-b.y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<130){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle="rgba(97,184,255,"+((1-dist/130)*.18)+")";ctx.lineWidth=.7;ctx.stroke();}
      }
    }
    particles.forEach(function(p){
      var pulse=.6+Math.sin(t/650+p.fase)*.3;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r+pulse*.7,0,Math.PI*2);
      ctx.fillStyle=cor(p,.6);ctx.shadowColor=cor(p,.7);ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;
    });
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize",resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>

</body>
