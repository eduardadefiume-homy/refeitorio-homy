<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  min-height:100%;
  font-family:"Barlow",sans-serif;
  color:#e8f0ff;
  background:#040c1a;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse 70% 42% at 18% 8%,rgba(35,98,210,.20),transparent 60%),
    radial-gradient(ellipse 62% 40% at 88% 88%,rgba(24,190,125,.12),transparent 64%),
    radial-gradient(ellipse 50% 34% at 50% 105%,rgba(192,40,28,.10),transparent 70%),
    linear-gradient(180deg,#040c1a 0%,#041126 58%,#030912 100%);
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(72,138,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(72,138,255,.045) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,.25));
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,.25));
}

.homy-tech-bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}

#homyTechCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:.82;
}

.homy-scan-line{
  position:absolute;
  left:-20%;
  right:-20%;
  top:-12%;
  height:160px;
  background:linear-gradient(180deg,transparent,rgba(80,170,255,.055),rgba(34,200,121,.03),transparent);
  transform:rotate(-7deg);
  animation:homyScanMove 11s ease-in-out infinite;
}

@keyframes homyScanMove{
  0%{top:-20%;opacity:0}
  16%{opacity:1}
  70%{opacity:.75}
  100%{top:108%;opacity:0}
}

.homy-chem-symbol{
  position:absolute;
  width:150px;
  height:132px;
  opacity:.12;
  filter:drop-shadow(0 0 22px rgba(80,170,255,.25));
  animation:homyChemFloat 12s ease-in-out infinite alternate;
}

.homy-chem-symbol.s1{left:8%;top:14%;animation-duration:15s}
.homy-chem-symbol.s2{right:8%;top:16%;animation-duration:18s;transform:scale(.8) rotate(18deg)}
.homy-chem-symbol.s3{left:52%;bottom:7%;animation-duration:20s;transform:scale(1.15) rotate(-10deg)}

.homy-chem-symbol::before{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid rgba(122,190,255,.52);
  clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%);
}

.homy-chem-symbol::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:9px;
  height:9px;
  border-radius:50%;
  background:rgba(34,200,121,.75);
  box-shadow:
    -48px -42px 0 rgba(97,184,255,.75),
    48px -42px 0 rgba(97,184,255,.7),
    65px 0 0 rgba(192,40,28,.68),
    48px 42px 0 rgba(97,184,255,.72),
    -48px 42px 0 rgba(97,184,255,.72),
    -65px 0 0 rgba(34,200,121,.65);
}

@keyframes homyChemFloat{
  0%{translate:0 0;opacity:.08}
  50%{translate:14px -18px;opacity:.16}
  100%{translate:-10px 12px;opacity:.11}
}

<script>
const DIAS = ["domingo", "segunda", "terca", "quarta", "quinta", "sexta", "sabado"];

const DIAS_LABEL = {
  domingo: "Domingo",
  segunda: "Segunda-feira",
  terca: "Terça-feira",
  quarta: "Quarta-feira",
  quinta: "Quinta-feira",
  sexta: "Sexta-feira",
  sabado: "Sábado"
};

const TAG_CLASS = {
  principal: "tag-principal",
  light: "tag-light",
  carne: "tag-carne",
  massa: "tag-massa",
  lanche: "tag-lanche",
  ausente: "tag-ausente"
};

const TAG_LABEL = {
  principal: "Principal",
  light: "Light",
  carne: "Carne",
  massa: "Massa",
  lanche: "Lanche",
  ausente: "Ausente"
};

const ORDEM_OPCOES = ["principal", "light", "carne", "massa", "lanche", "ausente"];

let CARDAPIO_HOJE = [];
let PEDIDOS_HOJE = [];
let PEDIDOS_VISIVEIS = [];
let SEMANA_ID = "";
let DIA_HOJE = "";

function escapeHtml(valor) {
  return String(valor || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function normalizarTexto(valor) {
  return String(valor || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

function normalizarOpcao(valor) {
  const s = normalizarTexto(valor);

  if (s.startsWith("prin")) return "principal";
  if (s.startsWith("lig")) return "light";
  if (s.startsWith("car")) return "carne";
  if (s.startsWith("mas")) return "massa";
  if (s.startsWith("lan")) return "lanche";
  if (s.startsWith("aus")) return "ausente";

  return s || "principal";
}

function limparTexto(valor) {
  return String(valor || "")
    .replace(/\r/g, "\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

function detalhesLista(valor) {
  return limparTexto(valor)
    .split(/\n|;/)
    .map(x => x.replace(/^[-•·\s]+/, "").trim())
    .filter(Boolean);
}

function getCampo(item, ...keys) {
  for (const key of keys) {
    if (item && item[key] !== undefined && item[key] !== null) return item[key];
  }

  return "";
}

function avisoPorOpcaoCardapioDia(opcao) {
  const op = normalizarOpcao(opcao);

  if (op === "principal") {
    return "O cardápio acima está sujeito à alterações.";
  }

  if (op === "light") {
    return "A opção Light substitui o prato principal completo.";
  }

  if (op === "lanche") {
    return "A opção Lanche substitui o prato principal completo.";
  }

  if (op === "carne") {
    return "A opção Carne substitui a carne do prato principal.";
  }

  if (op === "massa") {
    return "A opção Massa substitui a carne do prato principal.";
  }

  return "";
}

function ehLinhaAvisoAntigo(texto) {
  const n = normalizarTexto(texto);

  return n.includes("cardapio acima esta sujeito") ||
    n.includes("opcoes carne e massa substituem") ||
    n.includes("opcao carne substitui") ||
    n.includes("opcao massa substitui") ||
    n.includes("opcao light substitui") ||
    n.includes("opcao lanche substitui") ||
    n.includes("opcao light e lanche substitui") ||
    n.includes("opcoes light e lanche substituem") ||
    n.includes("substituem a carne do prato principal") ||
    n.includes("substitui a carne do prato principal") ||
    n.includes("substitui o prato principal completo");
}

function separarDetalhesEAviso(opcao, detalhes) {
  const comida = detalhesLista(detalhes).filter(x => !ehLinhaAvisoAntigo(x));
  const aviso = avisoPorOpcaoCardapioDia(opcao);

  return { comida, aviso };
}

function deduplicarCardapio(items) {
  const mapa = new Map();

  for (const item of items || []) {
    const dia = normalizarTexto(getCampo(item, "Dia", "dia"));
    const opcao = normalizarOpcao(getCampo(item, "Opcao", "opcao"));
    const chave = `${dia}|${opcao}`;

    if (!dia || !opcao) continue;

    if (!mapa.has(chave)) {
      mapa.set(chave, item);
      continue;
    }

    const atual = mapa.get(chave);
    const detAtual = String(getCampo(atual, "Detalhes", "detalhes") || "");
    const detNovo = String(getCampo(item, "Detalhes", "detalhes") || "");

    if (detNovo.length > detAtual.length) {
      mapa.set(chave, item);
    }
  }

  return Array.from(mapa.values());
}

function montarItemCardapio(item) {
  const opcao = normalizarOpcao(getCampo(item, "Opcao", "opcao"));
  const nome = getCampo(item, "Nome_Prato", "NomePrato", "nomePrato", "Prato", "Title") || "Prato não informado";
  const detalhes = getCampo(item, "Detalhes", "detalhes") || "";

  const partes = separarDetalhesEAviso(opcao, detalhes);

  return {
    tag: opcao,
    tagLabel: TAG_LABEL[opcao] || opcao,
    tagClass: TAG_CLASS[opcao] || "tag-principal",
    nome,
    comida: partes.comida,
    aviso: partes.aviso
  };
}

function ordenarPorOpcao(lista) {
  return [...(lista || [])].sort((a, b) => {
    const ia = ORDEM_OPCOES.indexOf(a.tag);
    const ib = ORDEM_OPCOES.indexOf(b.tag);

    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
}

function abrirModalCardapio(op) {
  const modalTag = document.getElementById("modalTag");
  const modalTitle = document.getElementById("modalTitle");
  const modalBody = document.getElementById("modalBody");

  modalTag.textContent = op.tagLabel;
  modalTag.className = `modal-tag ${op.tagClass}`;
  modalTitle.textContent = op.nome;

  const comidaHtml = op.comida.length
    ? op.comida.map(x => `
      <div class="modal-detail">
        <span class="modal-detail-text">${escapeHtml(x)}</span>
      </div>
    `).join("")
    : `
      <div class="modal-detail">
        <span class="modal-detail-text">Sem detalhes adicionais cadastrados.</span>
      </div>
    `;

  const avisoHtml = op.aviso
    ? `<div class="modal-note">ℹ️ ${escapeHtml(op.aviso)}</div>`
    : "";

  modalBody.innerHTML = comidaHtml + avisoHtml;

  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function fecharModal() {
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

function criarCardCardapio(op) {
  const card = document.createElement("div");
  card.className = "option-card";

  const comidaHtml = op.comida.map(x =>
    `<div class="option-detail">${escapeHtml(x)}</div>`
  ).join("");

  const avisoHtml = op.aviso
    ? `<div class="option-aviso">ℹ️ ${escapeHtml(op.aviso)}</div>`
    : "";

  card.innerHTML = `
    <div class="option-header">
      <span class="option-tag ${escapeHtml(op.tagClass)}">${escapeHtml(op.tagLabel)}</span>
      <span class="option-name">${escapeHtml(op.nome)}</span>
    </div>
    <div class="option-body">
      ${comidaHtml}
      ${avisoHtml}
    </div>
    <div class="option-hint">Toque para ver detalhes</div>
  `;

  card.addEventListener("click", () => abrirModalCardapio(op));

  return card;
}

function renderCardapioHoje() {
  const grid = document.getElementById("cardapioGrid");
  grid.innerHTML = "";

  if (!CARDAPIO_HOJE.length) {
    grid.innerHTML = `<div class="empty-box">Nenhum cardápio cadastrado para hoje.</div>`;
    return;
  }

  CARDAPIO_HOJE.forEach(op => {
    grid.appendChild(criarCardCardapio(op));
  });
}

function pedidoEhVisivelPublico(pedido) {
  const origem = normalizarTexto(getCampo(pedido, "Origem", "tipo", "Tipo"));
  const tipo = normalizarTexto(getCampo(pedido, "Tipo", "tipo"));
  const nome = normalizarTexto(getCampo(pedido, "Colaborador_nome", "Nome", "Title"));
  const status = normalizarTexto(getCampo(pedido, "Status"));
  const opcao = normalizarOpcao(getCampo(pedido, "Opcao"));

  if (status.includes("nao vai almocar") || status.includes("ausente")) return false;
  if (opcao === "ausente") return false;

  if (origem.includes("guarda") || tipo.includes("guarda")) return false;
  if (origem.includes("investigador") || tipo.includes("investigador")) return false;

  if (nome.includes("refeicao extra")) return false;
  if (origem.includes("refeicao extra")) return false;
  if (tipo.includes("refeicao extra")) return false;

  return true;
}

function montarPedidoVisivel(pedido) {
  const opcao = normalizarOpcao(getCampo(pedido, "Opcao"));
  const nome = getCampo(pedido, "Colaborador_nome", "Nome", "Title") || "Não informado";
  const prato = getCampo(pedido, "Nome_Prato", "Prato", "Title") || TAG_LABEL[opcao] || "Pedido";
  const status = getCampo(pedido, "Status") || "Confirmado";
  const centroCusto = getCampo(pedido, "Centro_Custo", "CentroCusto") || "";
  const observacao = getCampo(pedido, "Observacao", "Observação", "obs") || "";
  const origem = getCampo(pedido, "Origem", "tipo", "Tipo") || "Colaborador";

  return {
    id: getCampo(pedido, "id", "ID"),
    nome,
    opcao,
    opcaoLabel: TAG_LABEL[opcao] || opcao,
    tagClass: TAG_CLASS[opcao] || "tag-principal",
    prato,
    status,
    centroCusto,
    observacao,
    origem
  };
}

function abrirModalPedido(info) {
  const modalTag = document.getElementById("modalTag");
  const modalTitle = document.getElementById("modalTitle");
  const modalBody = document.getElementById("modalBody");

  modalTag.textContent = "Pedido";
  modalTag.className = `modal-tag ${info.tagClass}`;
  modalTitle.textContent = info.nome;

  const linhas = [
    ["Dia", DIAS_LABEL[DIA_HOJE] || DIA_HOJE],
    ["Opção", info.opcaoLabel],
    ["Prato", info.prato],
    ["Status", info.status],
    ["Origem", info.origem],
    ["Centro de custo", info.centroCusto],
    ["Observação", info.observacao]
  ].filter(([, valor]) => String(valor || "").trim());

  modalBody.innerHTML = linhas.map(([label, valor]) => `
    <div class="modal-detail">
      <span class="modal-detail-text"><strong>${escapeHtml(label)}:</strong> ${escapeHtml(valor)}</span>
    </div>
  `).join("");

  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function criarCardPedido(info) {
  const div = document.createElement("div");
  div.className = "func-card";

  div.innerHTML = `
    <div class="func-name">${escapeHtml(info.nome)}</div>
    <div class="func-opcao">
      <span class="func-tag ${escapeHtml(info.tagClass)}">${escapeHtml(info.opcaoLabel)}</span>
      <span class="func-status">${escapeHtml(info.prato)}</span>
    </div>
  `;

  div.addEventListener("click", () => abrirModalPedido(info));

  return div;
}
function renderPedidosBusca() {
  const busca = normalizarTexto(document.getElementById("buscaColaborador").value);
  const grid = document.getElementById("funcGrid");
  const count = document.getElementById("searchCount");

  grid.innerHTML = "";

  const dados = PEDIDOS_VISIVEIS
    .filter(info => {
      if (!busca) return true;

      return normalizarTexto(info.nome).includes(busca) ||
        normalizarTexto(info.prato).includes(busca) ||
        normalizarTexto(info.opcaoLabel).includes(busca) ||
        normalizarTexto(info.centroCusto).includes(busca);
    })
    .slice(0, 120);

  count.textContent = busca
    ? `${dados.length} resultado(s) encontrado(s)`
    : `${PEDIDOS_VISIVEIS.length} pedidos visíveis hoje`;

  if (!dados.length) {
    grid.innerHTML = busca
      ? `<div class="empty-box">Nenhum pedido encontrado para esse nome.</div>`
      : `<div class="empty-box">Nenhum pedido visível para hoje.</div>`;
    return;
  }

  dados.forEach(info => grid.appendChild(criarCardPedido(info)));

}

function diaHojeKey() {
  const d = new Date().getDay();
  return DIAS[d] || "segunda";
}

function atualizarHeader() {
  const hoje = new Date();
  const dia = diaHojeKey();

  const meses = [
    "janeiro","fevereiro","março","abril","maio","junho",
    "julho","agosto","setembro","outubro","novembro","dezembro"
  ];

  document.getElementById("headerSub").textContent =
    `${DIAS_LABEL[dia] || "Hoje"}, ${hoje.getDate()} de ${meses[hoje.getMonth()]}`;
}

async function carregarDados() {
  try {
    await window.HOMY_SP_READY;

    const ok = await SP.ensureLoginSilenciosoOuAviso();

    if (!ok) {
      document.getElementById("cardapioGrid").innerHTML =
        `<div class="empty-box">Não foi possível conectar ao SharePoint. Verifique o login Microsoft.</div>`;
      document.getElementById("searchCount").textContent = "Aguardando login Microsoft";
      return;
    }

    SEMANA_ID = SP.getCurrentWeekId();
    DIA_HOJE = diaHojeKey();

    const [cardapioSemana, pedidosSemana] = await Promise.all([
      SP.getCardapio(SEMANA_ID),
      SP.getPedidos(SEMANA_ID)
    ]);

    const cardapioHojeRaw = deduplicarCardapio(cardapioSemana)
      .filter(i => normalizarTexto(getCampo(i, "Dia", "dia")) === normalizarTexto(DIA_HOJE));

    CARDAPIO_HOJE = ordenarPorOpcao(cardapioHojeRaw.map(montarItemCardapio));

    PEDIDOS_HOJE = (pedidosSemana || [])
      .filter(p => normalizarTexto(getCampo(p, "Dia")) === normalizarTexto(DIA_HOJE));

    PEDIDOS_VISIVEIS = PEDIDOS_HOJE
      .filter(pedidoEhVisivelPublico)
      .map(montarPedidoVisivel)
      .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));

    renderCardapioHoje();
    renderPedidosBusca();

  } catch (e) {
    console.error("[cardapio-dia] erro:", e);

    document.getElementById("cardapioGrid").innerHTML =
      `<div class="empty-box">Não foi possível conectar ao SharePoint. Verifique o login Microsoft.</div>`;

    document.getElementById("searchCount").textContent = "Erro ao carregar dados";
  }
}

document.getElementById("modalClose").addEventListener("click", fecharModal);

document.getElementById("modalOverlay").addEventListener("click", e => {
  if (e.target === e.currentTarget) fecharModal();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") fecharModal();
});

document.getElementById("buscaColaborador").addEventListener("input", renderPedidosBusca);

atualizarHeader();
carregarDados();
</script>

<script>
(function(){
  const canvas = document.getElementById("homyTechCanvas");
  const ctx = canvas.getContext("2d");
  let w = 0;
  let h = 0;
  let points = [];

  function resize(){
    w = canvas.width = window.innerWidth * devicePixelRatio;
    h = canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    const count = Math.min(95, Math.max(42, Math.floor(window.innerWidth / 16)));

    points = Array.from({length: count}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - .5) * .22 * devicePixelRatio,
      vy: (Math.random() - .5) * .22 * devicePixelRatio,
      r: (Math.random() * 2.2 + 1.2) * devicePixelRatio,
      c: Math.random()
    }));
  }

  function color(p, a){
    if (p.c < .16) return `rgba(192,40,28,${a})`;
    if (p.c < .36) return `rgba(34,200,121,${a})`;
    return `rgba(97,184,255,${a})`;
  }

  function draw(){
    ctx.clearRect(0,0,w,h);

    for (let i=0;i<points.length;i++){
      const p = points[i];

      p.x += p.vx;
      p.y += p.vy;

      if (p.x < -20 || p.x > w + 20) p.vx *= -1;
      if (p.y < -20 || p.y > h + 20) p.vy *= -1;

      for (let j=i+1;j<points.length;j++){
        const q = points[j];
        const dx = p.x - q.x;
        const dy = p.y - q.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        const max = 130 * devicePixelRatio;

        if (d < max){
          ctx.strokeStyle = `rgba(97,184,255,${(1-d/max)*.12})`;
          ctx.lineWidth = .7 * devicePixelRatio;
          ctx.beginPath();
          ctx.moveTo(p.x,p.y);
          ctx.lineTo(q.x,q.y);
          ctx.stroke();
        }
      }

      ctx.fillStyle = color(p,.45);
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener("resize",resize);
  resize();
  draw();
})();
</script>
