<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testes · Regras Refeitório Homy</title>
  <style>
    body { font-family: Arial, sans-serif; background:#061123; color:#e8f0ff; padding:24px; }
    h1 { margin-top:0; }
    .ok { color:#58d68d; }
    .fail { color:#ff7675; }
    .card { border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:14px 16px; margin:10px 0; background:rgba(255,255,255,.04); }
    code { color:#9bd2ff; }
  </style>
</head>
<body>
  <h1>Testes · Regras Refeitório Homy</h1>
  <div id="resultado"></div>

  <script src="../refeitorio-regras.js?v=regras-operacionais-20260625-fase1"></script>
  <script>
    const R = window.HomyRefeitorioRegras;
    const out = document.getElementById("resultado");
    const testes = [];

    function teste(nome, fn) { testes.push({ nome, fn }); }
    function pedido(dados) {
      return Object.assign({
        id: Math.random().toString(36).slice(2),
        Semana_id: "2026-W26",
        Dia: "quarta",
        Opcao: "principal",
        Colaborador_id: "1",
        Colaborador_nome: "Colaborador Teste",
        Confirmado: true,
        Status: "Confirmado",
        Origem: "Refeitório",
        Data_Hora: "2026-06-24T12:00:00"
      }, dados || {});
    }

    teste("Confirmado=true + Status Férias não entra na produção", () => {
      return R.pedidoConfirmadoProducao(pedido({ Status: "Férias", Confirmado: true })) === false;
    });

    teste("Confirmado=true + Status Cancelado não entra na produção", () => {
      return R.pedidoConfirmadoProducao(pedido({ Status: "Cancelado", Confirmado: true })) === false;
    });

    teste("Status Confirmado entra na produção", () => {
      return R.pedidoConfirmadoProducao(pedido({ Status: "Confirmado", Confirmado: true })) === true;
    });

    teste("Guarda aparece na cozinha, mas não no Cardápio do Dia", () => {
      const p = pedido({ Colaborador_id: "extra-10", Colaborador_nome: "Guarda", Origem: "guarda", Status: "Confirmado" });
      return R.visivelCozinha(p) === true && R.visivelCardapioDia(p) === false;
    });

    teste("Investigador aparece na cozinha, mas não no Cardápio do Dia", () => {
      const p = pedido({ Colaborador_id: "extra-11", Colaborador_nome: "Investigador 2", Origem: "investigador", Status: "Confirmado" });
      return R.visivelCozinha(p) === true && R.visivelCardapioDia(p) === false;
    });

    teste("Prestador confirmado aparece no Cardápio do Dia", () => {
      const p = pedido({ Colaborador_id: "extra-12", Colaborador_nome: "Prestador ABC", Origem: "prestador", Status: "Confirmado" });
      return R.visivelCardapioDia(p) === true;
    });

    teste("Visitante confirmado aparece no Cardápio do Dia", () => {
      const p = pedido({ Colaborador_id: "extra-13", Colaborador_nome: "Visitante ABC", Origem: "visitante", Status: "Confirmado" });
      return R.visivelCardapioDia(p) === true;
    });

    teste("Duplicidade do mesmo colaborador/dia mantém o pedido válido confirmado", () => {
      const lista = [
        pedido({ id:"10", Colaborador_id:"99", Colaborador_nome:"Rafael", Status:"Férias", Confirmado:true, Data_Hora:"2026-06-23T12:00:00" }),
        pedido({ id:"11", Colaborador_id:"99", Colaborador_nome:"Rafael", Status:"Confirmado", Confirmado:true, Data_Hora:"2026-06-24T12:00:00" })
      ];
      const dedup = R.deduplicarPedidos(lista);
      return dedup.length === 1 && R.getPedidoId(dedup[0]) === "11" && R.pedidoConfirmadoProducao(dedup[0]);
    });

    teste("Resumo de produção conta opções e exclui ausência", () => {
      const lista = [
        pedido({ id:"1", Colaborador_id:"1", Opcao:"principal", Status:"Confirmado" }),
        pedido({ id:"2", Colaborador_id:"2", Opcao:"carne", Status:"Confirmado" }),
        pedido({ id:"3", Colaborador_id:"3", Opcao:"massa", Status:"Férias", Confirmado:true })
      ];
      const r = R.calcularResumoProducao(lista, { dia:"quarta" });
      return r.total === 2 && r.principal === 1 && r.carne === 1 && r.massa === 0 && r.excluidos.length === 1;
    });

    teste("Rafael: férias até terça gera alerta se quarta não tem pedido", () => {
      const colaboradores = [{ id:"99", Nome:"Rafael" }];
      const ausencias = [{ Colaborador_id:"99", Colaborador_nome:"Rafael", Data_Inicio:"2026-06-22", Data_Fim:"2026-06-23", Motivo:"ferias", Ativo:true }];
      const alertas = R.diagnosticarRetornosEsperados({ colaboradores, pedidos:[], ausencias, semanaId:"2026-W26", dia:"quarta" });
      return alertas.length === 1 && alertas[0].tipo === "retorno-sem-pedido";
    });

    let ok = 0;
    testes.forEach(t => {
      let passou = false;
      let erro = "";
      try { passou = !!t.fn(); }
      catch (e) { erro = e.message || String(e); }
      if (passou) ok++;
      const div = document.createElement("div");
      div.className = "card " + (passou ? "ok" : "fail");
      div.innerHTML = `${passou ? "✅" : "❌"} <strong>${t.nome}</strong>${erro ? `<br><code>${erro}</code>` : ""}`;
      out.appendChild(div);
    });

    const resumo = document.createElement("h2");
    resumo.textContent = `${ok}/${testes.length} testes passaram`;
    resumo.className = ok === testes.length ? "ok" : "fail";
    out.prepend(resumo);
  </script>
</body>
</html>
